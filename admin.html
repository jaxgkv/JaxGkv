<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JaxGkv Admin</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="navbar">
  <div class="logo">Jax<span>Gkv</span></div>
  <nav>
    <a href="index.html">Beranda</a>
  </nav>
</header>

<main class="hero">
  <section>
    <p class="badge">JAXGKV • ADMIN</p>
    <h1>Panel <span>Admin</span></h1>
    <p class="desc">Kelola pengajuan top up pengguna.</p>
  </section>
</main>

<section class="cards">
  <div class="card">
    <h2>Pengajuan Top Up</h2>
    <p id="loading">Memuat data...</p>
    <div id="topupList"></div>
  </div>
</section>

<footer>
  © 2026 JaxGkv. All rights reserved.
</footer>

<script>

const supabaseClient = window.supabase.createClient(
  "https://evuwahoflentgidcjmsx.supabase.co",
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3"
);

async function start() {

  const { data: userData } =
    await supabaseClient.auth.getUser();

  const user = userData.user;

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const { data: profile } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

  if (!profile || profile.role !== "admin") {
    alert("Akses admin ditolak.");
    window.location.href = "index.html";
    return;
  }

  loadTopups();
}


async function loadTopups() {

  const list =
    document.getElementById("topupList");

  const loading =
    document.getElementById("loading");

  const { data, error } =
    await supabaseClient
      .from("topup_request")
      .select(
        "id,user_id,nominal,status,created_at"
      )
      .order(
        "created_at",
        { ascending: false }
      );

  loading.style.display = "none";

  if (error) {
    list.innerHTML =
      "<p>Gagal mengambil data: " +
      error.message +
      "</p>";
    return;
  }

  list.innerHTML = "";

  if (!data || data.length === 0) {
    list.innerHTML =
      "<p>Belum ada pengajuan top up.</p>";
    return;
  }

  data.forEach(function(item) {

    const div =
      document.createElement("div");

    div.className = "card";
    div.style.marginTop = "15px";

    const nominal =
      Number(item.nominal)
        .toLocaleString("id-ID");

    const tanggal =
      new Date(item.created_at)
        .toLocaleString("id-ID");

    let button = "";

    if (item.status === "pending") {

      button = `
        <button
          class="btn primary"
          onclick="approveTopup(${item.id})">
          Approve Top Up
        </button>
      `;

    } else if (item.status === "approved") {

      button = `
        <p><b>✓ Sudah disetujui</b></p>
      `;

    }

    div.innerHTML = `
      <h3>Top Up #${item.id}</h3>

      <p>
        <b>User ID:</b><br>
        ${item.user_id}
      </p>

      <p>
        <b>Nominal:</b>
        Rp${nominal}
      </p>

      <p>
        <b>Status:</b>
        ${item.status}
      </p>

      <p>
        <b>Tanggal:</b>
        ${tanggal}
      </p>

      ${button}
    `;

    list.appendChild(div);
  });
}


async function approveTopup(id) {

  if (!confirm(
    "Yakin ingin menyetujui top up ini?"
  )) {
    return;
  }

  const { error } =
    await supabaseClient.rpc(
      "approve_topup",
      {
        p_topup_id: id
      }
    );

  if (error) {

    alert(
      "Gagal approve:\n" +
      error.message
    );

    return;
  }

  alert(
    "Top up berhasil disetujui!"
  );

  loadTopups();
}


start();

</script>

</body>
</html>
