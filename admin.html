<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: #d4af37;
    }

    .box {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .nominal {
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      color: #aaa;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #ff5555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Admin Panel</h1>

  <div id="message"></div>

  <div id="requests">
    Memuat request...
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "GANTI_DENGAN_PUBLISHABLE_KEY_YANG_SAMA_DENGAN_LOGIN";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function checkAdmin() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "login.html";
    return false;
  }

  const { data: profile, error: profileError } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();

  if (profileError || !profile || profile.role !== "admin") {
    document.getElementById("requests").innerHTML =
      '<div class="box error">Akses ditolak. Halaman ini khusus admin.</div>';

    return false;
  }

  return true;
}


async function loadRequests() {

  const container = document.getElementById("requests");

  const { data, error } =
    await supabaseClient
      .from("topup_request")
      .select("*")
      .eq("status", "pending")
      .order("created_at", { ascending: false });

  if (error) {
    container.innerHTML =
      `<div class="box error">Gagal memuat data: ${error.message}</div>`;
    return;
  }

  if (!data || data.length === 0) {
    container.innerHTML =
      '<div class="box empty">Tidak ada top-up pending.</div>';
    return;
  }

  container.innerHTML = "";

  data.forEach(req => {

    const box = document.createElement("div");
    box.className = "box";

    box.innerHTML = `
      <div class="row">

        <div>
          <div class="nominal">
            Rp${Number(req.nominal).toLocaleString("id-ID")}
          </div>

          <div class="status">
            ID Request: ${req.id}
          </div>

          <div class="status">
            User ID: ${req.user_id}
          </div>

          <div class="status">
            ${new Date(req.created_at).toLocaleString("id-ID")}
          </div>
        </div>

        <button onclick="approveTopup(${req.id}, this)">
          Approve
        </button>

      </div>
    `;

    container.appendChild(box);
  });
}


async function approveTopup(id, button) {

  if (!confirm("Approve top-up ini?")) {
    return;
  }

  button.disabled = true;
  button.textContent = "Memproses...";

  const { error } =
    await supabaseClient.rpc("approve_topup", {
      request_id: id
    });

  if (error) {

    alert("Gagal approve:\n" + error.message);

    button.disabled = false;
    button.textContent = "Approve";

    return;
  }

  alert("Top-up berhasil di-approve.");

  loadRequests();
}


(async function() {

  const isAdmin = await checkAdmin();

  if (isAdmin) {
    loadRequests();
  }

})();
</script>

</body>
</html>
