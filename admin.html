<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAXGKV • Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 25px 16px;
    }

    .brand {
      color: #d4af37;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 8px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .section {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .section-title {
      color: #d4af37;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .topup {
      background: #101010;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .topup:last-child {
      margin-bottom: 0;
    }

    .topup-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #fff;
    }

    .info {
      margin: 8px 0;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .label {
      color: #777;
    }

    .nominal {
      color: #d4af37;
      font-size: 21px;
      font-weight: bold;
    }

    .pending {
      color: #f0b90b;
      font-weight: bold;
    }

    .approved {
      color: #43d17b;
      font-weight: bold;
    }

    .other {
      color: #aaa;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 12px;
      margin-top: 15px;
      background: #d4af37;
      color: #000;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #102d1a;
      border: 1px solid #235b35;
      color: #62db8a;
    }

    .message.error {
      display: block;
      background: #351414;
      border: 1px solid #642525;
      color: #ff7373;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 25px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 25px 10px;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">JAXGKV • ADMIN</div>

  <h1>Panel Admin</h1>

  <div class="subtitle">
    Kelola pengajuan top up pengguna.
  </div>

  <div id="message" class="message"></div>

  <div class="section">

    <div class="section-title">
      Pengajuan Top Up
    </div>

    <div id="requests">
      <div class="loading">
        Memuat pengajuan...
      </div>
    </div>

  </div>

  <div class="footer">
    © 2026 JaxGkv. All rights reserved.
  </div>

</div>


<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";


/*
  PENTING:
  Ganti nilai di bawah dengan Publishable Key
  yang SAMA PERSIS dengan login.html dan register.html.
*/
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function showMessage(text, type) {

  const element =
    document.getElementById("message");

  element.textContent = text;

  element.className =
    "message " + type;

}


async function checkAdmin() {

  const {
    data: { user },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "login.html";

    return false;
  }


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();


  if (
    profileError ||
    !profile ||
    profile.role !== "admin"
  ) {

    document.getElementById(
      "requests"
    ).innerHTML = `
      <div class="empty">
        Akses ditolak. Halaman ini khusus admin.
      </div>
    `;

    return false;
  }


  return true;
}


async function loadRequests() {

  const container =
    document.getElementById("requests");


  container.innerHTML = `
    <div class="loading">
      Memuat pengajuan...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("topup_request")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    container.innerHTML = `
      <div class="empty">
        Gagal memuat data:<br><br>
        ${error.message}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Belum ada pengajuan top up.
      </div>
    `;

    return;
  }


  container.innerHTML = "";


  data.forEach(function(req) {

    const item =
      document.createElement("div");

    item.className = "topup";


    const nominal =
      Number(req.nominal)
        .toLocaleString("id-ID");


    const tanggal =
      new Date(req.created_at)
        .toLocaleString("id-ID");


    let statusHTML = "";


    if (req.status === "pending") {

      statusHTML = `
        <div class="status pending">
          Pending
        </div>

        <button
          type="button"
          onclick="approveTopup(${req.id}, this)">
          Approve Top Up
        </button>
      `;

    } else if (req.status === "approved") {

      statusHTML = `
        <div class="status approved">
          ✓ Sudah disetujui
        </div>
      `;

    } else {

      statusHTML = `
        <div class="status other">
          Status: ${req.status}
        </div>
      `;
    }


    item.innerHTML = `

      <div class="topup-title">
        Top Up #${req.id}
      </div>

      <div class="info">
        <span class="label">
          User ID:
        </span>
        <br>
        ${req.user_id}
      </div>

      <div class="info">
        <span class="label">
          Nominal:
        </span>
        <br>

        <span class="nominal">
          Rp${nominal}
        </span>
      </div>

      <div class="info">
        <span class="label">
          Status:
        </span>
        <br>
        ${req.status}
      </div>

      <div class="info">
        <span class="label">
          Tanggal:
        </span>
        <br>
        ${tanggal}
      </div>

      ${statusHTML}

    `;


    container.appendChild(item);

  });

}


async function approveTopup(
  id,
  button
) {

  const confirmed =
    confirm(
      "Approve top-up ini?\n\n" +
      "Saldo pengguna akan bertambah " +
      "sesuai nominal."
    );


  if (!confirmed) {
    return;
  }


  button.disabled = true;

  button.textContent =
    "Memproses...";


  /*
    PENTING:
    Nama parameter HARUS "request_id"
    karena fungsi SQL adalah:

    approve_topup(request_id bigint)
  */

  const {
    error
  } =
    await supabaseClient.rpc(
      "approve_topup",
      {
        request_id: id
      }
    );


  if (error) {

    console.error(
      "Approve error:",
      error
    );


    showMessage(
      "Gagal approve: " +
      error.message,
      "error"
    );


    button.disabled = false;

    button.textContent =
      "Approve Top Up";

    return;
  }


  showMessage(
    "Top-up berhasil disetujui.",
    "success"
  );


  await loadRequests();

}


async function init() {

  const isAdmin =
    await checkAdmin();


  if (!isAdmin) {
    return;
  }


  await loadRequests();

}


init();

</script>

</body>
</html>
