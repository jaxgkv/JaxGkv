<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JaxGkv — Admin</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="navbar">

  <div class="logo">
    Jax<span>Gkv</span>
  </div>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="produk.html">Produk</a>
  </nav>

</header>


<main class="hero">

  <section>

    <p class="badge">
      JAXGKV • ADMIN
    </p>

    <h1>
      Panel <span>Admin</span>
    </h1>

    <p class="desc">
      Kelola pengajuan top up pengguna.
    </p>

  </section>

</main>


<section class="cards">

  <div class="card">

    <h2>Pengajuan Top Up</h2>

    <p id="loading">
      Memuat data...
    </p>

    <div id="topupList"></div>

  </div>

</section>


<footer>
  © 2026 JaxGkv. All rights reserved.
</footer>


<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


async function loadTopups() {

  const loading =
    document.getElementById("loading");

  const list =
    document.getElementById("topupList");


  const {
    data: topups,
    error
  } =
    await supabaseClient
      .from("topup_request")
      .select(
        "id, user_id, nominal, status, created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (loading) {
    loading.style.display = "none";
  }


  if (error) {

    console.error(error);

    list.innerHTML = `
      <div class="card">
        <p>
          Gagal mengambil data top up.
        </p>

        <p>
          ${error.message}
        </p>
      </div>
    `;

    return;
  }


  if (!topups || topups.length === 0) {

    list.innerHTML = `
      <div class="card">
        <p>
          Belum ada pengajuan top up.
        </p>
      </div>
    `;

    return;
  }


  list.innerHTML = "";


  topups.forEach(function(item) {

    const div =
      document.createElement("div");


    div.className = "card";

    div.style.marginTop = "15px";


    const nominal =
      Number(item.nominal || 0)
        .toLocaleString("id-ID");


    const tanggal =
      item.created_at
        ? new Date(item.created_at)
            .toLocaleString("id-ID")
        : "-";


    div.innerHTML = `

      <h3>
        Top Up #${item.id}
      </h3>

      <p>
        <b>User ID:</b><br>
        ${item.user_id}
      </p>

      <p>
        <b>Nominal:</b>
        Rp${nominal}
      </p>

      <p>
        <b>Status:</b>
        ${item.status}
      </p>

      <p>
        <b>Tanggal:</b>
        ${tanggal}
      </p>

    `;


    list.appendChild(div);

  });

}


loadTopups();

</script>

</body>
</html>
