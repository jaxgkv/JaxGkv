<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Produk - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #111827;
    }

    .container {
      max-width: 1050px;
      margin: auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
    }

    h2 {
      margin-top: 0;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);

    label {
      display: block;

      margin-top: 13px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      background: white;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-right: 6px;
      margin-top: 10px;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .add {

      color: white;
      width: 100%;
      margin-top: 18px;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .delete {
      background: #dc2626;
      color: white;
    }

    .back {
      background: #e5e7eb;
      color: #111827;
    }

    .cancel {
      background: #6b7280;
      color: white;
    }

    .save {
      background: #16a34a;
      color: white;
    }

    .product {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 14px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .product-image {
      width: 140px;
      height: 140px;
      border-radius: 10px;
      object-fit: cover;
      background: #f3f4f6;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 220px;
    }

    .product-name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .category {
      display: inline-block;
      background: #e5e7eb;
      color: #374151;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 6px 0;
    }

    .description {
      color: #555;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .stock {
      font-size: 14px;
      margin-top: 8px;
      font-weight: bold;
    }

    .stock-empty {
      color: #dc2626;
    }

    .stock-ok {
      color: #16a34a;
    }

    .empty {
      color: #6b7280;
      text-align: center;
      padding: 25px;
    }

    .loading {
      text-align: center;
      color: #6b7280;
      padding: 25px;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;

    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .preview {
      margin-top: 8px;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
      display: none;
    }

    .edit-panel {
      width: 100%;
      margin-top: 15px;
      padding: 16px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
    }

    .edit-panel h3 {
      margin-top: 0;
    }

    .edit-preview {
      margin-top: 8px;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ddd;
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .url-help {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      }

      }

      .product-image {

        height: 200px;

      }

  </style>

<body>

<div class="container">

  <div class="topbar">
    <h1>⚙️ Admin Produk</h1>

    <button
      class="back"
      onclick="location.href='admin.html'">
      ← Admin
    </button>
  </div>


  <!-- =========================
       TAMBAH PRODUK
  ========================== -->

  <div class="box">

    <h2>➕ Tambah Produk</h2>

    <label for="nama">Nama Produk</label>

    <input
      type="text"
      id="nama"
      placeholder="Contoh: Pulsa 10.000"
      maxlength="100"
      autocomplete="off"
    >


    <label for="harga">Harga</label>

    <input
      type="number"
      id="harga"
      placeholder="Contoh: 10000"
      min="1"
      step="1"
    >


    <label for="kategori">Kategori</label>

    <input
      type="text"
      id="kategori"
      placeholder="Contoh: Pulsa"
      value="Umum"
      maxlength="50"
    >


    <label for="deskripsi">Deskripsi</label>

    <textarea
      id="deskripsi"
      placeholder="Deskripsi produk..."
      maxlength="1000"
    ></textarea>


    <label for="gambar">URL Gambar</label>

    <input
      type="url"
      id="gambar"
      placeholder="https://contoh.com/gambar.jpg"
      maxlength="2000"
      oninput="previewGambar()"
    >

    <div class="url-help">
      Gunakan URL yang diawali http:// atau https://
    </div>

    <img
      id="imagePreview"
      class="preview"
      alt="Preview gambar"
    >


    <label for="stok">Stok</label>

    <input
      type="number"
      id="stok"
      placeholder="Contoh: 10"
      min="0"
      step="1"
      value="0"
    >


    <button
      id="addButton"
      class="add"
      onclick="tambahProduk()">
      + Tambah Produk
    </button>


    <div
      id="formMessage"
      class="message">
    </div>

  </div>


  <!-- =========================
       DAFTAR PRODUK
  ========================== -->

  <div class="box">

    <h2>📦 Daftar Produk</h2>

    <div id="produkList">
      <div class="loading">
        Memuat produk...
      </div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// =====================================================
// CEK ADMIN
// =====================================================

async function cekAdmin() {

  const {
    data: {
      session
    },
    error
  } = await supabaseClient.auth.getSession();

  if (error || !session) {

    alert(
      "Silakan login terlebih dahulu."
    );

    location.href =
      "login.html";

    return false;
  }


  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq(
      "id",
      session.user.id
    )
    .maybeSingle();


  if (profileError) {

    console.error(
      profileError
    );

    alert(
      "Gagal memeriksa akun."
    );

    location.href =
      "index.html";

    return false;
  }


  if (
    !profile ||
    profile.role !== "admin"
  ) {

    alert(
      "Halaman ini khusus admin."
    );

    location.href =
      "index.html";

    return false;
  }


  return true;
}


// =====================================================
// FORMAT RUPIAH
// =====================================================

function formatRupiah(nominal) {

  return "Rp" +
    Number(nominal || 0)
      .toLocaleString("id-ID");

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;
}


// =====================================================
// VALIDASI IMAGE URL
// =====================================================

function isValidImageUrl(value) {

  if (!value) {
    return true;
  }

  try {

    const url =
      new URL(value);

    return (
      url.protocol === "http:" ||
      url.protocol === "https:"
    );

  } catch {

    return false;

  }
}


// =====================================================
// LOAD PRODUCTS
// =====================================================

async function loadProducts() {

  const list =
    document.getElementById(
      "produkList"
    );


  list.innerHTML = `
    <div class="loading">
      Memuat produk...
    </div>
  `;


  const {
    data,
    error
  } = await supabaseClient
    .from("products")
    .select(`
      id,
      name,
      price,
      description,
      category,
      image_url,
      stock
    `)
    .order(
      "id",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(error);

    list.innerHTML = `
      <div class="message error">
        Gagal memuat produk:
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">
        Belum ada produk.
      </div>
    `;

    return;
  }


  list.innerHTML = "";


  data.forEach(product => {

    const div =
      document.createElement("div");

    div.className =
      "product";


    const imageUrl =
      product.image_url || "";


    let imageHTML = "";

    if (imageUrl) {

      imageHTML = `
        <img
          class="product-image"
          src="${escapeHtml(imageUrl)}"
          alt="${escapeHtml(product.name)}"
          loading="lazy"
          onerror="this.style.display='none'"
        >
      `;

    }


    const stock =
      Number(product.stock || 0);


    const stockClass =
      stock > 0
        ? "stock-ok"
        : "stock-empty";


    const stockText =
      stock > 0
        ? `📦 Stok: ${stock}`
        : "❌ Stok habis";


    div.innerHTML = `

      ${imageHTML}

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(product.name)}
        </div>

        <div class="category">
          🏷️
          ${escapeHtml(product.category || "Umum")}
        </div>

        <div class="price">
          ${formatRupiah(product.price)}
        </div>

        <div class="description">
          ${
            escapeHtml(
              product.description ||
              "Tidak ada deskripsi."
            )
          }
        </div>

        <div class="stock ${stockClass}">
          ${stockText}
        </div>


        <button
          class="edit"
          onclick="showEditForm(${Number(product.id)})">
          ✏️ Edit
        </button>


        <button
          class="delete"
          onclick="hapusProduk(${Number(product.id)})">
          🗑️ Hapus
        </button>

      </div>


      <!-- EDIT PANEL -->

      <div
        id="edit-panel-${Number(product.id)}"
        class="edit-panel hidden">

        <h3>
          ✏️ Edit Produk
        </h3>


        <label>
          Nama Produk
        </label>

        <input
          type="text"
          id="edit-name-${Number(product.id)}"
          maxlength="100"
          value="${escapeHtml(product.name || "")}"
        >


        <label>
          Harga
        </label>

        <input
          type="number"
          id="edit-price-${Number(product.id)}"
          min="1"
          step="1"
          value="${Number(product.price || 0)}"
        >


        <label>
          Kategori
        </label>

        <input
          type="text"
          id="edit-category-${Number(product.id)}"
          maxlength="50"
          value="${escapeHtml(product.category || "Umum")}"
        >


        <label>
          Deskripsi
        </label>

        <textarea
          id="edit-description-${Number(product.id)}"
          maxlength="1000"
        >${escapeHtml(product.description || "")}</textarea>


        <label>
          URL Gambar
        </label>

        <input
          type="url"
          id="edit-image-${Number(product.id)}"
          maxlength="2000"
          value="${escapeHtml(product.image_url || "")}"
          oninput="previewEditGambar(${Number(product.id)})"
        >


        <img
          id="edit-preview-${Number(product.id)}"
          class="edit-preview"
          alt="Preview gambar"
        >


        <label>
          Stok
        </label>

        <input
          type="number"
          id="edit-stock-${Number(product.id)}"
          min="0"
          step="1"
          value="${stock}"
        >


        <button
          class="save"
          id="save-button-${Number(product.id)}"
          onclick="simpanEdit(${Number(product.id)})">
          💾 Simpan
        </button>


        <button
          class="cancel"
          onclick="hideEditForm(${Number(product.id)})">
          Batal
        </button>


        <div
          id="edit-message-${Number(product.id)}"
          class="message">
        </div>

      </div>

    `;


    list.appendChild(div);


    if (imageUrl) {

      const preview =
        document.getElementById(
          `edit-preview-${Number(product.id)}`
        );

      if (preview) {

        preview.src =
          imageUrl;

        preview.style.display =
          "block";

      }
    }

  });

}


// =====================================================
// PREVIEW GAMBAR TAMBAH
// =====================================================

function previewGambar() {

  const url =
    document.getElementById(
      "gambar"
    ).value.trim();


  const preview =
    document.getElementById(
      "imagePreview"
    );


  if (
    !url ||
    !isValidImageUrl(url)
  ) {

    preview.style.display =
      "none";

    return;
  }


  preview.src =
    url;

  preview.style.display =
    "block";


  preview.onerror =
    function() {

      preview.style.display =
        "none";

    };

}


// =====================================================
// PREVIEW GAMBAR EDIT
// =====================================================

function previewEditGambar(id) {

  const input =
    document.getElementById(
      `edit-image-${id}`
    );


  const preview =
    document.getElementById(
      `edit-preview-${id}`
    );


  if (
    !input ||
    !preview
  ) {
    return;
  }


  const url =
    input.value.trim();


  if (
    !url ||
    !isValidImageUrl(url)
  ) {

    preview.style.display =
      "none";

    return;
  }


  preview.src =
    url;

  preview.style.display =
    "block";


  preview.onerror =
    function() {

      preview.style.display =
        "none";

    };

}


// =====================================================
// MESSAGE TAMBAH
// =====================================================

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "formMessage"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;

}


// =====================================================
// MESSAGE EDIT
// =====================================================

function showEditMessage(
  id,
  text,
  type
) {

  const box =
    document.getElementById(
      `edit-message-${id}`
    );


  if (!box) {
    return;
  }


  box.textContent =
    text;


  box.className =
    "message " + type;

}


// =====================================================
// TAMBAH PRODUK
// =====================================================

async function tambahProduk() {

  const nama =
    document.getElementById(
      "nama"
    ).value.trim();


  const harga =
    Number(
      document.getElementById(
        "harga"
      ).value
    );


  const kategori =
    document.getElementById(
      "kategori"
    ).value.trim() ||
    "Umum";


  const deskripsi =
    document.getElementById(
      "deskripsi"
    ).value.trim();


  const gambar =
    document.getElementById(
      "gambar"
    ).value.trim();


  const stok =
    Number(
      document.getElementById(
        "stok"
      ).value
    );


  // VALIDASI NAMA

  if (!nama) {

    showMessage(
      "Nama produk wajib diisi.",
      "error"
    );

    return;
  }


  // VALIDASI HARGA

  if (
    !Number.isInteger(harga) ||
    harga <= 0
  ) {

    showMessage(
      "Harga harus berupa angka bulat lebih dari 0.",
      "error"
    );

    return;
  }


  // VALIDASI STOK

  if (
    !Number.isInteger(stok) ||
    stok < 0
  ) {

    showMessage(
      "Stok harus berupa angka bulat 0 atau lebih.",
      "error"
    );

    return;
  }


  // VALIDASI IMAGE

  if (
    !isValidImageUrl(gambar)
  ) {

    showMessage(
      "URL gambar harus menggunakan http:// atau https://.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "addButton"
    );


  button.disabled =
    true;

  button.textContent =
    "⏳ Menyimpan...";


  try {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "admin_add_product",
      {
        p_name:
          nama,

        p_price:
          harga,

        p_description:
          deskripsi,

        p_category:
          kategori,

        p_image_url:
          gambar,

        p_stock:
          stok
      }
    );


    if (error) {
      throw error;
    }


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data?.message ||
        "Gagal menambahkan produk."
      );

    }


    showMessage(
      "✅ Produk berhasil ditambahkan.",
      "success"
    );


    document.getElementById(
      "nama"
    ).value = "";


    document.getElementById(
      "harga"
    ).value = "";


    document.getElementById(
      "kategori"
    ).value = "Umum";


    document.getElementById(
      "deskripsi"
    ).value = "";


    document.getElementById(
      "gambar"
    ).value = "";


    document.getElementById(
      "stok"
    ).value = "0";


    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";


    await loadProducts();

  } catch (error) {

    console.error(error);

    showMessage(
      "Gagal menambah produk: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "+ Tambah Produk";

  }

}


// =====================================================
// TAMPILKAN EDIT
// =====================================================

function showEditForm(id) {

  const panel =
    document.getElementById(
      `edit-panel-${id}`
    );


  if (!panel) {
    return;
  }


  panel.classList.remove(
    "hidden"
  );


  panel.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });

}


// =====================================================
// SEMBUNYIKAN EDIT
// =====================================================

function hideEditForm(id) {

  const panel =
    document.getElementById(
      `edit-panel-${id}`
    );


  if (!panel) {
    return;
  }


  panel.classList.add(
    "hidden"
  );

}


// =====================================================
// SIMPAN EDIT
// =====================================================

async function simpanEdit(id) {

  const nama =
    document.getElementById(
      `edit-name-${id}`
    ).value.trim();


  const harga =
    Number(
      document.getElementById(
        `edit-price-${id}`
      ).value
    );


  const kategori =
    document.getElementById(
      `edit-category-${id}`
    ).value.trim() ||
    "Umum";


  const deskripsi =
    document.getElementById(
      `edit-description-${id}`
    ).value.trim();


  const gambar =
    document.getElementById(
      `edit-image-${id}`
    ).value.trim();


  const stok =
    Number(
      document.getElementById(
        `edit-stock-${id}`
      ).value
    );


  // VALIDASI NAMA

  if (!nama) {

    showEditMessage(
      id,
      "Nama produk wajib diisi.",
      "error"
    );

    return;
  }


  // VALIDASI HARGA

  if (
    !Number.isInteger(harga) ||
    harga <= 0
  ) {

    showEditMessage(
      id,
      "Harga harus berupa angka bulat lebih dari 0.",
      "error"
    );

    return;
  }


  // VALIDASI STOK

  if (
    !Number.isInteger(stok) ||
    stok < 0
  ) {

    showEditMessage(
      id,
      "Stok harus berupa angka bulat 0 atau lebih.",
      "error"
    );

    return;
  }


  // VALIDASI IMAGE

  if (
    !isValidImageUrl(gambar)
  ) {

    showEditMessage(
      id,
      "URL gambar harus menggunakan http:// atau https://.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      `save-button-${id}`
    );


  button.disabled =
    true;

  button.textContent =
    "⏳ Menyimpan...";


  try {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "admin_update_product",
      {
        p_id:
          id,

        p_name:
          nama,

        p_price:
          harga,

        p_description:
          deskripsi,

        p_category:
          kategori,

        p_image_url:
          gambar,

        p_stock:
          stok
      }
    );


    if (error) {
      throw error;
    }


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data?.message ||
        "Gagal mengubah produk."
      );

    }


    showEditMessage(
      id,
      "✅ Produk berhasil diperbarui.",
      "success"
    );


    await loadProducts();

  } catch (error) {

    console.error(error);

    showEditMessage(
      id,
      "Gagal mengubah produk: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "💾 Simpan";

  }

}


// =====================================================
// HAPUS PRODUK
// =====================================================

async function hapusProduk(id) {

  const yakin =
    confirm(
      "Yakin ingin menghapus produk ini?\n\n" +
      "Data produk yang dihapus tidak dapat dikembalikan."
    );


  if (!yakin) {
    return;
  }


  try {

    const {
      data,
      error
    } = await supabaseClient.rpc(
      "admin_delete_product",
      {
        p_id:
          id
      }
    );


    if (error) {
      throw error;
    }


    if (
      !data ||
      !data.success
    ) {

      throw new Error(
        data?.message ||
        "Gagal menghapus produk."
      );

    }


    alert(
      "🗑️ Produk berhasil dihapus."
    );


    await loadProducts();

  } catch (error) {

    console.error(error);

    alert(
      "Gagal menghapus produk: " +
      error.message
    );

  }

}

  const isAdmin =

  if (!isAdmin) {

  await loadProducts();
