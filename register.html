<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - JaxGkv</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      color: #d4af37;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .box {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #d4af37;
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #65d889;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 14px;
    }

    .login a {
      color: #d4af37;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">JaxGkv</div>
    <div class="subtitle">Buat akun baru</div>

    <div class="box">
      <h1>Daftar</h1>

      <form id="registerForm">

        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Masukkan email"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Minimal 6 karakter"
          minlength="6"
          required
        >

        <label for="confirmPassword">Konfirmasi Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Ulangi password"
          minlength="6"
          required
        >

        <button type="submit" id="registerButton">
          Daftar
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login">
        Sudah punya akun?
        <a href="login.html">Login</a>
      </div>
    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://evuwahoflentgidcjmsx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_G8bm8mavzC6TZgqSKcQ2iQ_goV_yeD_";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      message.textContent = "";
      message.className = "message";

      if (password !== confirmPassword) {
        message.textContent = "Password dan konfirmasi password tidak sama.";
        message.classList.add("error");
        return;
      }

      if (password.length < 6) {
        message.textContent = "Password minimal 6 karakter.";
        message.classList.add("error");
        return;
      }

      button.disabled = true;
      button.textContent = "Mendaftarkan...";

      const { data, error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        message.classList.add("error");

        button.disabled = false;
        button.textContent = "Daftar";
        return;
      }

      message.textContent =
        "Pendaftaran berhasil. Silakan cek email untuk verifikasi akun jika diminta.";

      message.classList.add("success");

      form.reset();

      button.disabled = false;
      button.textContent = "Daftar";
    });
  </script>

</body>
</html>
