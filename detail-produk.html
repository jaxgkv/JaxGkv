<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail Produk - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    nav {
      background: #111827;
      color: white;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 12px;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .product-image {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      background: #f1f1f1;
      margin-bottom: 20px;
    }

    .no-image {
      width: 100%;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f1f1;
      border-radius: 12px;
      font-size: 70px;
      margin-bottom: 20px;
    }

    .category {
      display: inline-block;
      background: #e5e7eb;
      color: #374151;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0 12px;
      font-size: 28px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      color: #16a34a;
      margin: 15px 0;
    }

    .description {
      color: #555;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .stock {
      font-weight: bold;
      margin-bottom: 20px;
    }

    .stock.available {
      color: #16a34a;
    }

    .stock.empty {
      color: #dc2626;
    }

    .quantity-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .quantity-box button {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 8px;
      background: #e5e7eb;
      font-size: 20px;
      cursor: pointer;
    }

    #quantity {
      width: 70px;
      height: 40px;
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 17px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: 0;
      padding: 13px;
      border-radius: 9px;
      cursor: pointer;
      color: white;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    .btn-cart {
      background: #2563eb;
    }

    .btn-buy {
      background: #16a34a;
    }

    .btn-video {
      background: #7c3aed;
      margin-top: 10px;
    }

    .btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #2563eb;
      text-decoration: none;
    }

    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .video-status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #f3f4f6;
      color: #555;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .actions {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>
  <strong>JaxGkv</strong>

  <div>
    <a href="produk.html">Produk</a>
    <a href="keranjang.html">🛒 Keranjang</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</nav>

<div class="container">

  <a href="produk.html" class="back">
    ← Kembali ke Produk
  </a>

  <div class="card" id="productCard">
    <div style="text-align:center;">
      Memuat produk...
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const params =
  new URLSearchParams(
    window.location.search
  );


const productId =
  params.get("id");


let product = null;

let currentUser = null;

let alreadyPurchased = false;


// =================================
// FORMAT RUPIAH
// =================================

function rupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(value);

}


// =================================
// ESCAPE HTML
// =================================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


// =================================
// MESSAGE
// =================================

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );

  if (!message) return;

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";

}


// =================================
// CEK USER
// =================================

async function cekLogin() {

  const {
    data: {
      user
    }
  } =
    await supabaseClient.auth.getUser();

  currentUser =
    user || null;

  return currentUser;

}


// =================================
// CEK SUDAH BELI
// =================================

async function cekPembelian() {

  alreadyPurchased =
    false;

  if (!currentUser) {
    return;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("orders")
      .select("id")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "product_id",
        product.id
      )
      .eq(
        "status",
        "paid"
      )
      .limit(1);

  if (error) {

    console.error(
      "Gagal cek order:",
      error
    );

    return;
  }

  alreadyPurchased =
    data &&
    data.length > 0;

}


// =================================
// RENDER PRODUK
// =================================

function renderProduct() {

  const card =
    document.getElementById(
      "productCard"
    );


  if (!product) {

    card.innerHTML = `
      <h2>Produk tidak ditemukan</h2>

      <p>
        Produk yang kamu cari tidak tersedia.
      </p>
    `;

    return;
  }


  const stock =
    Number(
      product.stock || 0
    );


  let imageHTML = "";


  if (
    product.image_url &&
    product.image_url.trim() !== ""
  ) {

    imageHTML = `

      <img
        src="${escapeHtml(
          product.image_url
        )}"
        class="product-image"
        alt="${escapeHtml(
          product.name
        )}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='flex';
        "
      >

      <div
        class="no-image"
        style="display:none;">

        🛍️

      </div>

    `;

  } else {

    imageHTML = `

      <div class="no-image">
        🛍️
      </div>

    `;

  }


  let videoHTML = "";


  if (alreadyPurchased) {

    videoHTML = `

      <div class="video-status">

        ✅ Kamu sudah membeli produk ini.

      </div>

      <a
        class="btn btn-video"
        href="video.html?id=${encodeURIComponent(
          product.id
        )}">

        🎬 Tonton Video

      </a>

    `;

  } else {

    videoHTML = `

      <div class="video-status">

        🔒 Video akan tersedia setelah pembelian berhasil.

      </div>

    `;

  }


  card.innerHTML = `

    ${imageHTML}

    <span class="category">

      🏷️ ${escapeHtml(
        product.category ||
        "Umum"
      )}

    </span>


    <h1>
      ${escapeHtml(
        product.name
      )}
    </h1>


    <div class="price">

      ${rupiah(
        product.price
      )}

    </div>


    <div class="description">

      ${escapeHtml(
        product.description ||
        "Tidak ada deskripsi."
      )}

    </div>


    <div
      class="stock ${
        stock > 0
          ? "available"
          : "empty"
      }">

      ${
        stock > 0
          ? "✅ Stok tersedia: " + stock
          : "❌ Stok habis"
      }

    </div>


    ${
      !alreadyPurchased
        ? `

          <div class="quantity-box">

            <button
              onclick="ubahJumlah(-1)">

              −

            </button>


            <input
              type="number"
              id="quantity"
              value="1"
              min="1"
              max="${stock}"
              ${stock <= 0 ? "disabled" : ""}
            >


            <button
              onclick="ubahJumlah(1)">

              +

            </button>

          </div>


          <div class="actions">

            <button
              class="btn btn-cart"
              onclick="tambahKeranjang()"
              ${
                stock <= 0
                  ? "disabled"
                  : ""
              }>

              🛒 Tambah ke Keranjang

            </button>


            <button
              class="btn btn-buy"
              onclick="beliSekarang()"
              ${
                stock <= 0
                  ? "disabled"
                  : ""
              }>

              ⚡ Beli Sekarang

            </button>

          </div>

        `
        : ""
    }


    ${videoHTML}


    <div
      id="message"
      class="message">

    </div>

  `;

}


// =================================
// UBAH JUMLAH
// =================================

function ubahJumlah(
  perubahan
) {

  const input =
    document.getElementById(
      "quantity"
    );

  if (
    !input ||
    !product
  ) {
    return;
  }


  let jumlah =
    Number(
      input.value || 1
    );


  jumlah +=
    perubahan;


  const max =
    Number(
      product.stock || 1
    );


  if (jumlah < 1) {
    jumlah = 1;
  }


  if (jumlah > max) {
    jumlah = max;
  }


  input.value =
    jumlah;

}


// =================================
// TAMBAH KERANJANG
// =================================

async function tambahKeranjang() {

  const user =
    await cekLogin();


  if (!user) {

    alert(
      "Silakan login terlebih dahulu."
    );

    window.location.href =
      "login.html";

    return;
  }


  const input =
    document.getElementById(
      "quantity"
    );


  const quantity =
    Number(
      input.value
    );


  if (
    !quantity ||
    quantity < 1
  ) {

    showMessage(
      "Jumlah tidak valid.",
      "error"
    );

    return;
  }


  if (
    quantity >
    Number(product.stock)
  ) {

    showMessage(
      "Jumlah melebihi stok.",
      "error"
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient.rpc(
      "add_to_cart",
      {
        p_product_id:
          product.id,

        p_quantity:
          quantity
      }
    );


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Produk berhasil ditambahkan ke keranjang.",
    "success"
  );

}


// =================================
// BELI SEKARANG
// =================================

async function beliSekarang() {

  const user =
    await cekLogin();


  if (!user) {

    alert(
      "Silakan login terlebih dahulu."
    );

    window.location.href =
      "login.html";

    return;
  }


  const input =
    document.getElementById(
      "quantity"
    );


  const quantity =
    Number(
      input.value
    );


  if (
    !quantity ||
    quantity < 1
  ) {

    showMessage(
      "Jumlah tidak valid.",
      "error"
    );

    return;
  }


  if (
    quantity >
    Number(product.stock)
  ) {

    showMessage(
      "Jumlah melebihi stok.",
      "error"
    );

    return;
  }


  const total =
    Number(product.price) *
    quantity;


  const yakin =
    confirm(
      "Yakin ingin membeli " +
      quantity +
      " produk dengan total " +
      rupiah(total) +
      "?"
    );


  if (!yakin) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "buy_product",
      {
        p_product_id:
          product.id,

        p_quantity:
          quantity
      }
    );


  if (error) {

    showMessage(
      "Pembelian gagal: " +
      error.message,
      "error"
    );

    return;
  }


  if (
    data &&
    data.success === false
  ) {

    showMessage(
      data.message ||
      "Pembelian gagal.",
      "error"
    );

    return;
  }


  alert(
    "✅ Pembelian berhasil!"
  );


  // Langsung arahkan ke video produk
  window.location.href =
    "video.html?id=" +
    encodeURIComponent(
      product.id
    );

}


// =================================
// LOAD PRODUCT
// =================================

async function loadProduct() {

  const card =
    document.getElementById(
      "productCard"
    );


  if (!productId) {

    card.innerHTML = `

      <h2>
        Produk tidak ditemukan
      </h2>

      <p>
        ID produk tidak ada di URL.
      </p>

    `;

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("products")
      .select(`
        id,
        name,
        price,
        description,
        category,
        image_url,
        stock,
        video_url
      `)
      .eq(
        "id",
        productId
      )
      .single();


  if (error) {

    console.error(error);


    card.innerHTML = `

      <h2>
        Gagal memuat produk
      </h2>

      <p>
        ${escapeHtml(
          error.message
        )}
      </p>

    `;

    return;
  }


  product =
    data;


  document.title =
    product.name +
    " - JaxGkv";


  await cekLogin();

  await cekPembelian();

  renderProduct();

}


// =================================
// START
// =================================

loadProduct();

</script>

</body>
</html>
