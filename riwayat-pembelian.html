<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pembelian - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .error {
      color: #c00;
    }

    .order {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .order-code {
      font-weight: bold;
    }

    .date {
      color: #777;
      font-size: 13px;
    }

    .item {
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 12px;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .info {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-detail {
      background: #111;
      color: white;
    }

    .btn-video {
      background: #1769ff;
      color: white;
    }

    .status {
      display: inline-block;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      background: #eee;
    }

    .status.completed {
      background: #d9f7df;
      color: #187a2f;
    }

    .status.pending {
      background: #fff0c2;
      color: #8a6500;
    }
  </style>
</head>

<body>

<header>
  JaxGkv — Riwayat Pembelian
</header>

<div class="container">

  <a class="back" href="produk.html">← Kembali ke Produk</a>

  <div id="content">
    <div class="loading">Memuat riwayat pembelian...</div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://evuwahoflentgidcjmsx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const content = document.getElementById("content");

  function formatRupiah(number) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      minimumFractionDigits: 0
    }).format(number || 0);
  }

  function formatDate(dateString) {
    if (!dateString) return "-";

    return new Date(dateString).toLocaleString("id-ID", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  async function loadHistory() {
    try {
      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        content.innerHTML = `
          <div class="error">
            <h3>Belum login</h3>
            <p>Silakan login terlebih dahulu.</p>
            <a class="btn btn-detail" href="login.html">Login</a>
          </div>
        `;
        return;
      }

      const user = session.user;

      const {
        data,
        error
      } = await supabaseClient
        .from("purchases")
        .select(`
          id,
          order_code,
          product_id,
          product_name,
          price,
          quantity,
          status,
          created_at
        `)
        .eq("user_id", user.id)
        .order("created_at", {
          ascending: false
        });

      if (error) {
        console.error(error);

        content.innerHTML = `
          <div class="error">
            ❌ Gagal memuat riwayat.<br><br>
            ${error.message}
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {
        content.innerHTML = `
          <div class="empty">
            Belum ada riwayat pembelian.
          </div>
        `;

        return;
      }

      /*
        PEMBENTUKAN GROUP

        Jika order_code ADA:
          group berdasarkan order_code.

        Jika order_code KOSONG:
          setiap purchase dianggap sebagai pesanan sendiri.

        Contoh:
          ID 12, order_code kosong
          => PURCHASE-12
      */

      const groups = {};

      data.forEach(item => {

        let groupKey;

        if (
          item.order_code &&
          String(item.order_code).trim() !== ""
        ) {
          groupKey = "ORDER-" + item.order_code;
        } else {
          groupKey = "PURCHASE-" + item.id;
        }

        if (!groups[groupKey]) {
          groups[groupKey] = [];
        }

        groups[groupKey].push(item);
      });

      let html = "";

      Object.keys(groups).forEach(groupKey => {

        const items = groups[groupKey];

        const firstItem = items[0];

        const hasOrderCode =
          firstItem.order_code &&
          String(firstItem.order_code).trim() !== "";

        /*
          KODE YANG DITAMPILKAN

          Ini hanya untuk tampilan.

          Jangan digunakan sebagai parameter ?order
          kalau order_code sebenarnya kosong.
        */

        const displayOrderCode = hasOrderCode
          ? firstItem.order_code
          : "PURCHASE-" + firstItem.id;

        /*
          INI BAGIAN PENTING

          Kalau order_code ada:
            detail-pesanan.html?order=JX-000003

          Kalau order_code kosong:
            detail-pesanan.html?purchase=12

          Jadi PURCHASE-12 TIDAK dikirim sebagai order_code.
        */

        let detailUrl;

        if (hasOrderCode) {
          detailUrl =
            "detail-pesanan.html?order=" +
            encodeURIComponent(firstItem.order_code);
        } else {
          detailUrl =
            "detail-pesanan.html?purchase=" +
            encodeURIComponent(firstItem.id);
        }

        let firstDate = firstItem.created_at;

        let itemsHtml = "";

        items.forEach(item => {

          const quantity = Number(item.quantity || 1);
          const price = Number(item.price || 0);
          const subtotal = price * quantity;

          const statusClass =
            String(item.status || "").toLowerCase();

          itemsHtml += `
            <div class="item">

              <div class="product-name">
                ${escapeHtml(item.product_name || "Produk")}
              </div>

              <div class="info">
                Harga: ${formatRupiah(price)}<br>
                Jumlah: ${quantity}<br>
                Subtotal: ${formatRupiah(subtotal)}
              </div>

              <div>
                <span class="status ${statusClass}">
                  ${escapeHtml(item.status || "-")}
                </span>
              </div>

              <div class="actions">

                <a
                  class="btn btn-detail"
                  href="detail-pesanan.html?purchase=${encodeURIComponent(item.id)}"
                >
                  Detail
                </a>

                ${
                  item.status === "completed" && item.product_id
                    ? `
                      <a
                        class="btn btn-video"
                        href="video.html?id=${encodeURIComponent(item.product_id)}"
                      >
                        🎬 Tonton Video
                      </a>
                    `
                    : ""
                }

              </div>

            </div>
          `;
        });

        html += `
          <div class="order">

            <div class="order-header">

              <div>
                <div class="order-code">
                  ${escapeHtml(displayOrderCode)}
                </div>

                <div class="date">
                  ${formatDate(firstDate)}
                </div>
              </div>

            </div>

            ${itemsHtml}

            <div class="actions">

              <a
                class="btn btn-detail"
                href="${detailUrl}"
              >
                Lihat Detail Pesanan
              </a>

            </div>

          </div>
        `;
      });

      content.innerHTML = html;

    } catch (err) {

      console.error(err);

      content.innerHTML = `
        <div class="error">
          ❌ Terjadi kesalahan.<br><br>
          ${escapeHtml(err.message || String(err))}
        </div>
      `;
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadHistory();
</script>

</body>
</html>
