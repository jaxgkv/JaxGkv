<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pembelian - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    nav {
      background: #111827;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    nav a,
    nav button {
      color: white;
      text-decoration: none;
      background: #374151;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    nav a:hover,
    nav button:hover {
      background: #4b5563;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .order {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .order-header {
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .order-code {
      font-size: 18px;
      font-weight: bold;
      color: #2563eb;
    }

    .date {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .item {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .product-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .detail {
      color: #4b5563;
      font-size: 14px;
      margin: 3px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 6px;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .total {
      text-align: right;
      font-size: 17px;
      font-weight: bold;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }

    .buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .detail-button {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 14px;
    }

    .detail-button:hover {
      background: #1d4ed8;
    }

    .video-button {
      display: inline-block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 14px;
    }

    .video-button:hover {
      background: #15803d;
    }

    .empty {
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      color: #6b7280;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">🏠 Beranda</a>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="produk.html">🛍️ Produk</a>
    <a href="keranjang.html">🛒 Keranjang</a>
    <a href="topup.html">💰 Top Up</a>
    <a href="riwayat-topup.html">📜 Riwayat Top Up</a>
    <a href="riwayat-pembelian.html">🧾 Riwayat Pembelian</a>
    <a href="notifikasi.html">🔔 Notifikasi</a>
    <a href="profil.html">👤 Profil</a>
    <button onclick="logout()">Logout</button>
  </nav>

  <div class="container">

    <h1>🧾 Riwayat Pembelian</h1>

    <div id="loading" class="loading">
      Memuat riwayat pembelian...
    </div>

    <div id="orders"></div>

  </div>

  <script>

    const SUPABASE_URL =
      "https://evuwahoflentgidcjmsx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    async function checkLogin() {

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error || !data.session) {

        window.location.href =
          "login.html";

        return null;
      }

      return data.session.user;
    }


    function formatRupiah(value) {

      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(value);

    }


    function formatDate(date) {

      return new Date(date).toLocaleString(
        "id-ID",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );

    }


    function statusHTML(status) {

      if (status === "processing") {

        return `
          <span class="status processing">
            ⚙️ Processing
          </span>
        `;

      }


      if (status === "completed") {

        return `
          <span class="status completed">
            ✅ Completed
          </span>
        `;

      }


      if (status === "cancelled") {

        return `
          <span class="status cancelled">
            ❌ Cancelled
          </span>
        `;

      }


      return `
        <span class="status pending">
          🕐 Pending
        </span>
      `;

    }


    async function loadPurchases() {

      const user =
        await checkLogin();

      if (!user) return;


      const loading =
        document.getElementById("loading");

      const orders =
        document.getElementById("orders");


      const { data, error } =
        await supabaseClient
          .from("purchases")
          .select(`
            id,
            order_code,
            product_id,
            product_name,
            price,
            quantity,
            status,
            created_at
          `)
          .eq("user_id", user.id)
          .order("created_at", {
            ascending: false
          });


      loading.style.display = "none";


      if (error) {

        orders.innerHTML = `
          <div class="empty">

            ❌ Gagal memuat
            riwayat pembelian.

            <br><br>

            ${error.message}

          </div>
        `;

        return;
      }


      if (!data || data.length === 0) {

        orders.innerHTML = `
          <div class="empty">

            📦 Belum ada pembelian.

          </div>
        `;

        return;
      }


      /*
        Kelompokkan transaksi
        berdasarkan Order ID.
      */

      const grouped = {};


      data.forEach(item => {

        const key =
          item.order_code ||
          `PURCHASE-${item.id}`;


        if (!grouped[key]) {

          grouped[key] = [];

        }


        grouped[key].push(item);

      });


      let html = "";


      Object.keys(grouped)
        .forEach(orderCode => {

          const items =
            grouped[orderCode];


          let orderTotal = 0;


          items.forEach(item => {

            const quantity =
              Number(item.quantity || 1);

            const subtotal =
              Number(item.price) *
              quantity;

            orderTotal += subtotal;

          });


          const firstItem =
            items[0];


          html += `

            <div class="order">

              <div class="order-header">

                <div class="order-code">
                  📦 Order ID:
                  ${orderCode}
                </div>

                <div class="date">
                  ${formatDate(
                    firstItem.created_at
                  )}
                </div>

              </div>

          `;


          items.forEach(item => {

            const quantity =
              Number(item.quantity || 1);


            const subtotal =
              Number(item.price) *
              quantity;


            html += `

              <div class="item">

                <div class="product-name">
                  ${item.product_name}
                </div>

                <div class="detail">
                  Harga:
                  ${formatRupiah(
                    item.price
                  )}
                </div>

                <div class="detail">
                  Jumlah:
                  ${quantity}
                </div>

                <div class="detail">
                  Subtotal:
                  ${formatRupiah(
                    subtotal
                  )}
                </div>

                ${statusHTML(
                  item.status
                )}

                ${
                  item.status === "completed" &&
                  item.product_id
                    ? `
                      <div>
                        <a
                          class="video-button"
                          href="video.html?id=${encodeURIComponent(item.product_id)}"
                        >
                          🎬 Tonton Video
                        </a>
                      </div>
                    `
                    : ""
                }

              </div>

            `;

          });


          html += `

              <div class="total">

                Total Pesanan:
                ${formatRupiah(
                  orderTotal
                )}

              </div>


              <div class="buttons">

                <a
                  class="detail-button"
                  href="detail-pesanan.html?order=${encodeURIComponent(orderCode)}"
                >
                  👁️ Lihat Detail
                </a>

              </div>

            </div>

          `;

        });


      orders.innerHTML = html;

    }


    async function logout() {

      await supabaseClient.auth.signOut();

      window.location.href =
        "login.html";

    }


    loadPurchases();

  </script>

</body>
</html>
