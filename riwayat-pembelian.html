<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Riwayat Pembelian - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      color: #111827;
    }

    nav {
      background: #111827;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a,
    nav button {
      color: white;
      text-decoration: none;
      background: #374151;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .loading,
    .error,
    .empty {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .error {
      color: #b91c1c;
    }

    .empty {
      color: #6b7280;
    }

    .order-card {
      background: white;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .order-code {
      font-size: 18px;
      font-weight: bold;
      color: #2563eb;
      word-break: break-word;
    }

    .date {
      color: #6b7280;
      font-size: 13px;
      margin-top: 5px;
    }

    .item {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .detail {
      color: #4b5563;
      font-size: 14px;
      margin: 3px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 6px;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .order-total {
      text-align: right;
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 2px solid #e5e7eb;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      border: none;
      padding: 9px 13px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }

    .detail-button {
      background: #111827;
      color: white;
    }

    .video-button {
      background: #2563eb;
      color: white;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Beranda</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="produk.html">🛍️ Produk</a>
  <a href="keranjang.html">🛒 Keranjang</a>
  <a href="topup.html">💰 Top Up</a>
  <a href="riwayat-pembelian.html">🧾 Riwayat Pembelian</a>
  <a href="notifikasi.html">🔔 Notifikasi</a>
  <a href="profil.html">👤 Profil</a>
  <button onclick="logout()">Logout</button>
</nav>


<div class="container">

  <h1>🧾 Riwayat Pembelian</h1>

  <div id="loading" class="loading">
    Memuat riwayat pembelian...
  </div>

  <div id="content"></div>

</div>


<script>
const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function formatRupiah(value) {

  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      maximumFractionDigits: 0
    }
  ).format(Number(value) || 0);
}


function formatDate(date) {

  if (!date) {
    return "-";
  }

  return new Date(date).toLocaleString(
    "id-ID",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );
}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function statusHTML(status) {

  if (status === "processing") {

    return `
      <span class="status processing">
        ⚙️ Processing
      </span>
    `;
  }


  if (status === "completed") {

    return `
      <span class="status completed">
        ✅ Completed
      </span>
    `;
  }


  if (status === "cancelled") {

    return `
      <span class="status cancelled">
        ❌ Cancelled
      </span>
    `;
  }


  return `
    <span class="status pending">
      🕐 Pending
    </span>
  `;
}


async function loadHistory() {

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");


  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  if (
    sessionError ||
    !sessionData.session
  ) {

    window.location.href =
      "login.html";

    return;
  }


  const user =
    sessionData.session.user;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("purchases")
      .select(`
        id,
        order_code,
        product_id,
        product_name,
        price,
        quantity,
        status,
        created_at
      `)
      .eq("user_id", user.id)
      .order("created_at", {
        ascending: false
      });


  loading.style.display = "none";


  if (error) {

    content.innerHTML = `
      <div class="error">
        ❌ Gagal memuat riwayat.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    content.innerHTML = `
      <div class="empty">
        Belum ada pembelian.
      </div>
    `;

    return;
  }


  /*
   * Produk yang mempunyai order_code yang sama
   * digabung menjadi satu pesanan.
   *
   * Kalau order_code kosong:
   * setiap purchase dianggap sebagai pesanan
   * sendiri.
   */

  const groups = new Map();


  data.forEach(item => {

    let groupKey;


    if (
      item.order_code &&
      item.order_code.trim()
    ) {

      groupKey =
        "ORDER-" +
        item.order_code;

    } else {

      groupKey =
        "PURCHASE-" +
        item.id;
    }


    if (!groups.has(groupKey)) {

      groups.set(
        groupKey,
        {
          orderCode:
            item.order_code &&
            item.order_code.trim()
              ? item.order_code
              : null,

          fallbackId:
            item.id,

          created_at:
            item.created_at,

          items: []
        }
      );
    }


    groups
      .get(groupKey)
      .items
      .push(item);
  });


  let html = "";


  groups.forEach(order => {

    let total = 0;


    order.items.forEach(item => {

      total +=
        Number(item.price || 0) *
        Number(item.quantity || 1);
    });


    /*
     * Nomor pesanan:
     * - order_code jika tersedia
     * - PURCHASE-ID jika kosong
     */

    const displayOrderCode =
      order.orderCode
        ? order.orderCode
        : "PURCHASE-" +
          order.fallbackId;


    /*
     * Detail selalu dikirim dengan purchase ID
     * untuk menjamin data lama tetap bisa dibuka.
     *
     * Untuk order yang mempunyai beberapa item,
     * detail-pesanan.html akan menggunakan order_code
     * bila tersedia.
     */

    const detailUrl =
      order.orderCode
        ? "detail-pesanan.html?order=" +
          encodeURIComponent(
            order.orderCode
          )
        : "detail-pesanan.html?purchase=" +
          encodeURIComponent(
            order.fallbackId
          );


    let itemsHTML = "";


    order.items.forEach(item => {

      const quantity =
        Number(item.quantity || 1);

      const subtotal =
        Number(item.price || 0) *
        quantity;


      let videoButton = "";


      if (
        item.status === "completed" &&
        item.product_id
      ) {

        videoButton = `
          <a
            class="button video-button"
            href="video.html?id=${encodeURIComponent(item.product_id)}"
          >
            🎬 Tonton Video
          </a>
        `;
      }


      itemsHTML += `

        <div class="item">

          <div class="product-name">
            ${escapeHtml(item.product_name)}
          </div>

          <div class="detail">
            Harga:
            ${formatRupiah(item.price)}
          </div>

          <div class="detail">
            Jumlah:
            ${quantity}
          </div>

          <div class="detail">
            Subtotal:
            ${formatRupiah(subtotal)}
          </div>

          ${statusHTML(item.status)}

          ${videoButton}

        </div>
      `;
    });


    html += `

      <div class="order-card">

        <div class="order-header">

          <div>

            <div class="order-code">
              📦 ${escapeHtml(displayOrderCode)}
            </div>

            <div class="date">
              Dibuat:
              ${formatDate(order.created_at)}
            </div>

          </div>

        </div>


        ${itemsHTML}


        <div class="order-total">
          Total:
          ${formatRupiah(total)}
        </div>


        <div class="buttons">

          <a
            class="button detail-button"
            href="${detailUrl}"
          >
            👁️ Lihat Detail
          </a>

        </div>

      </div>
    `;
  });


  content.innerHTML = html;
}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";
}


loadHistory();
</script>

</body>
</html>
