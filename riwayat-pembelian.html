<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Riwayat Pembelian - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    nav {
      background: #111;
      color: white;
      padding: 15px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product {
      font-size: 18px;
      font-weight: bold;
    }

    .info {
      margin-top: 8px;
      color: #555;
    }

    .status {
      margin-top: 12px;
      font-weight: bold;
    }

    .pending {
      color: #b8860b;
    }

    .processing {
      color: #007bff;
    }

    .completed {
      color: #198754;
    }

    .cancelled {
      color: #dc3545;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 40px;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Beranda</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="produk.html">🛍️ Produk</a>
  <a href="keranjang.html">🛒 Keranjang</a>
  <a href="topup.html">💳 Top Up</a>
  <a href="riwayat-pembelian.html">📦 Riwayat Pembelian</a>
  <a href="riwayat-topup.html">💰 Riwayat Top Up</a>
  <a href="notifikasi.html">🔔 Notifikasi</a>
  <a href="profil.html">👤 Profil</a>
  <a href="#" onclick="logout()">Logout</a>
</nav>

<div class="container">

  <h1>📦 Riwayat Pembelian</h1>

  <div id="purchaseList">
    Memuat riwayat...
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ===============================
// CEK LOGIN
// ===============================

async function checkLogin() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  loadPurchases();
}


// ===============================
// LOAD PEMBELIAN
// ===============================

async function loadPurchases() {

  const list =
    document.getElementById("purchaseList");

  list.innerHTML =
    "Memuat riwayat...";


  const {
    data,
    error
  } = await supabaseClient
    .from("purchases")
    .select(`
      id,
      product_name,
      price,
      quantity,
      status,
      created_at
    `)
    .order("created_at", {
      ascending: false
    });


  if (error) {

    console.error(error);

    list.innerHTML = `
      <div class="card">
        Gagal memuat riwayat pembelian.
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML = `
      <div class="card empty">

        <h2>📦 Belum ada pembelian</h2>

        <p>
          Kamu belum memiliki riwayat pembelian.
        </p>

        <a href="produk.html">
          Lihat Produk
        </a>

      </div>
    `;

    return;
  }


  list.innerHTML = "";


  data.forEach(item => {

    const div =
      document.createElement("div");

    div.className = "card";


    const quantity =
      item.quantity || 1;

    const subtotal =
      item.price * quantity;


    let statusText = "🕐 Pending";
    let statusClass = "pending";


    if (item.status === "processing") {

      statusText =
        "⚙️ Processing";

      statusClass =
        "processing";

    }
    else if (item.status === "completed") {

      statusText =
        "✅ Completed";

      statusClass =
        "completed";

    }
    else if (item.status === "cancelled") {

      statusText =
        "❌ Cancelled";

      statusClass =
        "cancelled";

    }


    const date =
      new Date(
        item.created_at
      ).toLocaleString(
        "id-ID"
      );


    div.innerHTML = `

      <div class="product">
        ${escapeHtml(item.product_name)}
      </div>

      <div class="info">
        Harga:
        <b>
          Rp ${formatRupiah(item.price)}
        </b>
      </div>

      <div class="info">
        Jumlah:
        <b>${quantity}</b>
      </div>

      <div class="info">
        Subtotal:
        <b>
          Rp ${formatRupiah(subtotal)}
        </b>
      </div>

      <div class="info">
        Tanggal:
        ${date}
      </div>

      <div class="status ${statusClass}">
        ${statusText}
      </div>

    `;


    list.appendChild(div);

  });

}


// ===============================
// FORMAT RUPIAH
// ===============================

function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID"
  ).format(number);

}


// ===============================
// AMANKAN TEKS
// ===============================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


// ===============================
// LOGOUT
// ===============================

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";

}


// ===============================
// START
// ===============================

checkLogin();

</script>

</body>
</html>
