<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kelola User - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    nav {
      background: #111;
      color: white;
      padding: 15px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .user {
      display: grid;
      grid-template-columns: 1fr 1fr 130px 190px 180px;
      gap: 15px;
      align-items: center;
    }

    .header {
      font-weight: bold;
      background: #111;
      color: white;
    }

    .name {
      font-weight: bold;
    }

    .email {
      color: #555;
      word-break: break-word;
    }

    .saldo {
      font-weight: bold;
    }

    .role {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: bold;
      background: #eee;
    }

    .role.admin {
      background: #111;
      color: white;
    }

    .role-actions {
      margin-top: 8px;
    }

    .role-button {
      border: none;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #eee;
    }

    .role-button:hover {
      background: #ddd;
    }

    .date {
      color: #666;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 30px;
    }

    .error {
      background: #ffe5e5;
      color: #b00020;
      padding: 15px;
      border-radius: 8px;
      display: none;
      margin-bottom: 15px;
    }

    .refresh {
      border: none;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 15px;
    }

    @media (max-width: 800px) {

      .header {
        display: none;
      }

      .user {
        display: block;
      }

      .user > div {
        margin-bottom: 12px;
      }

      .date {
        margin-bottom: 0 !important;
      }
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Beranda</a>
  <a href="admin-dashboard.html">📊 Dashboard</a>
  <a href="admin.html">💳 Top Up</a>
  <a href="admin-pembelian.html">📦 Pembelian</a>
  <a href="admin-produk.html">🛍️ Produk</a>
  <a href="admin-user.html">👥 User</a>
  <a href="dashboard.html">👤 User Dashboard</a>
  <a href="#" onclick="logout()">Logout</a>
</nav>

<div class="container">

  <h1>👥 Kelola User</h1>

  <button
    class="refresh"
    onclick="loadUsers()">
    🔄 Refresh User
  </button>

  <div id="error" class="error"></div>

  <div id="loading" class="loading">
    Memuat daftar user...
  </div>

  <div id="userList"></div>

</div>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ===============================
// CEK ADMIN
// ===============================

async function checkAdmin() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();

  if (error || !user) {
    window.location.href = "login.html";
    return;
  }

  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", user.id)
    .single();

  if (profileError || !profile) {

    alert(
      "Profile tidak ditemukan."
    );

    window.location.href =
      "dashboard.html";

    return;
  }

  if (profile.role !== "admin") {

    alert(
      "Akses admin ditolak."
    );

    window.location.href =
      "dashboard.html";

    return;
  }

  loadUsers();
}


// ===============================
// LOAD USERS
// ===============================

async function loadUsers() {

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const userList =
    document.getElementById("userList");

  loading.style.display = "block";

  errorBox.style.display = "none";

  userList.innerHTML = "";

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_get_users"
  );

  loading.style.display = "none";

  if (error) {

    console.error(error);

    errorBox.textContent =
      "Gagal memuat user: " +
      error.message;

    errorBox.style.display = "block";

    return;
  }

  if (!data || data.length === 0) {

    userList.innerHTML = `
      <div class="card">
        Belum ada user.
      </div>
    `;

    return;
  }


  // ===============================
  // HEADER
  // ===============================

  const header =
    document.createElement("div");

  header.className =
    "card user header";

  header.innerHTML = `
    <div>Nama</div>
    <div>Email</div>
    <div>Saldo</div>
    <div>Role</div>
    <div>Daftar</div>
  `;

  userList.appendChild(header);


  // ===============================
  // USERS
  // ===============================

  data.forEach(user => {

    const div =
      document.createElement("div");

    div.className =
      "card user";


    const role =
      user.role || "user";

    const roleClass =
      role === "admin"
        ? "role admin"
        : "role";


    let actionHtml = "";

    if (role === "admin") {

      actionHtml = `
        <button
          class="role-button"
          onclick="changeRole(
            '${user.id}',
            'user'
          )">
          Ubah ke User
        </button>
      `;

    } else {

      actionHtml = `
        <button
          class="role-button"
          onclick="changeRole(
            '${user.id}',
            'admin'
          )">
          Ubah ke Admin
        </button>
      `;

    }


    div.innerHTML = `

      <div class="name">
        ${escapeHtml(
          user.full_name || "-"
        )}
      </div>

      <div class="email">
        ${escapeHtml(
          user.email || "-"
        )}
      </div>

      <div class="saldo">
        Rp ${formatRupiah(
          user.saldo || 0
        )}
      </div>

      <div>

        <div class="${roleClass}">
          ${escapeHtml(role)}
        </div>

        <div class="role-actions">
          ${actionHtml}
        </div>

      </div>

      <div class="date">
        ${formatDate(
          user.created_at
        )}
      </div>

    `;

    userList.appendChild(div);

  });

}


// ===============================
// UBAH ROLE
// ===============================

async function changeRole(
  userId,
  newRole
) {

  const roleName =
    newRole === "admin"
      ? "Admin"
      : "User";

  const yakin =
    confirm(
      "Yakin ubah role user menjadi " +
      roleName +
      "?"
    );

  if (!yakin) {
    return;
  }


  const {
    data,
    error
  } = await supabaseClient.rpc(
    "admin_update_user_role",
    {
      p_user_id: userId,
      p_role: newRole
    }
  );


  if (error) {

    console.error(error);

    alert(
      "Gagal mengubah role:\n\n" +
      error.message
    );

    return;
  }


  alert(
    "✅ Role berhasil diubah menjadi " +
    roleName
  );


  loadUsers();
}


// ===============================
// FORMAT RUPIAH
// ===============================

function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID"
  ).format(number);

}


// ===============================
// FORMAT TANGGAL
// ===============================

function formatDate(date) {

  if (!date) {
    return "-";
  }

  return new Date(
    date
  ).toLocaleString(
    "id-ID",
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );

}


// ===============================
// ESCAPE HTML
// ===============================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


// ===============================
// LOGOUT
// ===============================

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";
}


// ===============================
// START
// ===============================

checkAdmin();

</script>

</body>
</html>
