<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JaxGkv — Admin Pembelian</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1120;
      color: white;
      margin: 0;
    }

    .navbar {
      padding: 18px 25px;
      background: #111827;
      border-bottom: 1px solid #263244;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #3b82f6;
    }

    .container {
      max-width: 1100px;
      margin: 35px auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
    }

    .refresh {
      margin: 0;
      background: #374151;
    }

    .loading,
    .empty {
      text-align: center;
      margin: 50px 0;
      opacity: 0.8;
    }

    .purchase {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .purchase-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      flex-wrap: wrap;
    }

    .purchase h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .order-code {
      font-size: 13px;
      color: #60a5fa;
      margin-bottom: 12px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 8px 0;
    }

    .quantity {
      font-size: 14px;
      color: #d1d5db;
    }

    .user {
      font-size: 13px;
      opacity: 0.7;
      word-break: break-all;
      margin-top: 12px;
    }

    .date {
      margin-top: 8px;
      opacity: 0.7;
      font-size: 13px;
    }

    .status {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #263244;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    select {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 14px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .success {
      color: #4ade80;
      margin-top: 10px;
      font-size: 14px;
    }

    .error-message {
      color: #f87171;
      margin-top: 10px;
      font-size: 14px;
    }

    .error {
      padding: 20px;
      background: #3f1515;
      border: 1px solid #ef4444;
      border-radius: 10px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .pending {
      background: #92400e;
      color: #fef3c7;
    }

    .processing {
      background: #1e40af;
      color: #dbeafe;
    }

    .completed {
      background: #166534;
      color: #dcfce7;
    }

    .cancelled {
      background: #991b1b;
      color: #fee2e2;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
        padding: 15px;
      }

      .navbar {
        padding: 15px;
      }

      .logo {
        font-size: 20px;
      }

      .purchase {
        padding: 16px;
      }

      .status-row {
        flex-direction: column;
        align-items: stretch;
      }

      select,
      .status-row button {
        width: 100%;
        margin: 0;
      }
    }
  </style>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="navbar">
  <div class="logo">
    Jax<span>Gkv</span> — Admin
  </div>
</header>

<main class="container">

  <div class="header">
    <h1>Semua Pembelian</h1>

    <button
      class="refresh"
      onclick="loadPurchases()">
      🔄 Refresh
    </button>
  </div>

  <div id="loading" class="loading">
    Memuat pembelian...
  </div>

  <div
    id="error"
    class="error"
    style="display:none;">
  </div>

  <section id="purchases"></section>

</main>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function statusLabel(status) {

  const labels = {
    pending: "🟡 Pending",
    processing: "🔵 Processing",
    completed: "🟢 Completed",
    cancelled: "🔴 Cancelled"
  };

  return labels[status] || status;

}


async function loadPurchases() {

  const loading =
    document.getElementById("loading");

  const container =
    document.getElementById("purchases");

  const errorBox =
    document.getElementById("error");

  loading.style.display = "block";

  errorBox.style.display = "none";

  container.innerHTML = "";

  const {
    data: sessionData
  } = await supabaseClient.auth.getSession();


  if (!sessionData.session) {

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent =
      "Silakan login sebagai admin.";

    return;
  }


  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq(
      "id",
      sessionData.session.user.id
    )
    .single();


  if (
    profileError ||
    !profile ||
    profile.role !== "admin"
  ) {

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.textContent =
      "Akses ditolak. Halaman ini khusus admin.";

    return;
  }


  const {
    data,
    error
  } = await supabaseClient
    .from("purchases")
    .select(`
      id,
      user_id,
      product_name,
      price,
      quantity,
      status,
      order_code,
      created_at
    `)
    .order(
      "created_at",
      {
        ascending: false
      }
    );


  loading.style.display = "none";


  if (error) {

    errorBox.style.display = "block";

    errorBox.textContent =
      "Gagal memuat pembelian: " +
      error.message;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Belum ada pembelian.
      </div>
    `;

    return;
  }


  data.forEach(purchase => {

    const item =
      document.createElement("div");

    item.className = "purchase";


    const date =
      new Date(
        purchase.created_at
      ).toLocaleString("id-ID");


    const currentStatus =
      purchase.status || "pending";


    const quantity =
      Number(purchase.quantity || 1);


    const price =
      Number(purchase.price || 0);


    const subtotal =
      price * quantity;


    const orderCode =
      purchase.order_code ||
      "PURCHASE-" + purchase.id;


    item.innerHTML = `

      <div class="purchase-top">

        <div>

          <h2>
            ${escapeHTML(
              purchase.product_name
            )}
          </h2>

          <div class="order-code">
            Order: ${escapeHTML(orderCode)}
          </div>

        </div>

        <span
          class="status-badge ${escapeHTML(
            currentStatus
          )}">

          ${escapeHTML(
            statusLabel(currentStatus)
          )}

        </span>

      </div>


      <div class="price">

        Rp${subtotal.toLocaleString("id-ID")}

      </div>


      <div class="quantity">

        Harga satuan:
        Rp${price.toLocaleString("id-ID")}

        &nbsp; × &nbsp;

        Jumlah:
        ${quantity}

      </div>


      <div class="user">

        User ID:
        ${escapeHTML(
          purchase.user_id
        )}

      </div>


      <div class="date">

        📅 ${escapeHTML(date)}

      </div>


      <div class="status">

        <b>Ubah Status Pesanan</b>


        <div class="status-row">

          <select
            id="status-${purchase.id}">

            <option
              value="pending"
              ${currentStatus === "pending"
                ? "selected"
                : ""}>
              🟡 Pending
            </option>

            <option
              value="processing"
              ${currentStatus === "processing"
                ? "selected"
                : ""}>
              🔵 Processing
            </option>

            <option
              value="completed"
              ${currentStatus === "completed"
                ? "selected"
                : ""}>
              🟢 Completed
            </option>

            <option
              value="cancelled"
              ${currentStatus === "cancelled"
                ? "selected"
                : ""}>
              🔴 Cancelled
            </option>

          </select>


          <button
            id="button-${purchase.id}"
            onclick="updateStatus(${purchase.id})">

            💾 Simpan Status

          </button>

        </div>


        <div
          id="message-${purchase.id}">
        </div>

      </div>

    `;


    container.appendChild(item);

  });

}


async function updateStatus(purchaseId) {

  const select =
    document.getElementById(
      "status-" + purchaseId
    );

  const button =
    document.getElementById(
      "button-" + purchaseId
    );

  const message =
    document.getElementById(
      "message-" + purchaseId
    );


  const newStatus =
    select.value;


  button.disabled = true;

  button.textContent =
    "Menyimpan...";


  message.className = "";

  message.textContent =
    "";


  const {
    error
  } = await supabaseClient.rpc(
    "admin_update_purchase_status",
    {
      p_purchase_id:
        purchaseId,

      p_status:
        newStatus
    }
  );


  button.disabled = false;

  button.textContent =
    "💾 Simpan Status";


  if (error) {

    message.className =
      "error-message";

    message.textContent =
      "❌ Gagal: " +
      error.message;

    return;
  }


  message.className =
    "success";

  message.textContent =
    "✓ Status berhasil diperbarui. Notifikasi telah dikirim.";


  setTimeout(() => {
    loadPurchases();
  }, 800);

}


loadPurchases();

</script>

</body>
</html>
