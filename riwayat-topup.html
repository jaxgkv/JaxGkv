<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Top Up — JaxGkv</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .history-wrap{max-width:850px;margin:auto}.history-item{margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:12px}.nominal{font-size:21px;font-weight:800;color:#e7b84b}.status{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.pending{background:#3a3118;color:#f3d77a}.approved{background:#173923;color:#9be3ae}.rejected{background:#3d1c1f;color:#ffabb1}.meta{color:#aaa;font-size:13px;line-height:1.7;margin-top:10px}.reason{margin-top:10px;padding:10px 12px;border-radius:10px;background:#2b1719;color:#ffb1b1}.empty{padding:30px;text-align:center;color:#aaa;border:1px dashed #333;border-radius:14px}
  </style>
</head>
<body>
<header class="navbar"><div class="logo">Jax<span>Gkv</span></div><nav><a href="index.html">Beranda</a><a href="dashboard.html">Dashboard</a><a href="topup.html">Top Up</a></nav></header>
<main class="hero"><section class="history-wrap"><p class="badge">JAXGKV • RIWAYAT</p><h1>Riwayat <span>Top Up</span></h1><p class="desc">Pantau semua pengajuan top up dan status verifikasinya.</p><div id="loading" class="card">Memuat riwayat...</div><div id="history"></div></section></main>
<footer>© 2026 JaxGkv. All rights reserved.</footer>
<script>
const SUPABASE_URL='https://evuwahoflentgidcjmsx.supabase.co';const SUPABASE_KEY='sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const historyEl=document.getElementById('history');const loadingEl=document.getElementById('loading');
function rupiah(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
async function loadHistory(){
 const {data:{user},error:userError}=await supabaseClient.auth.getUser();if(userError||!user){location.href='login.html';return;}
 const {data,error}=await supabaseClient.from('topup_request').select('id,nominal,status,rejection_reason,created_at,reviewed_at').eq('user_id',user.id).order('created_at',{ascending:false});
 loadingEl.style.display='none';
 if(error){historyEl.innerHTML=`<div class="card">Gagal memuat riwayat: ${esc(error.message)}</div>`;return;}
 if(!data?.length){historyEl.innerHTML='<div class="empty">Belum ada pengajuan top up.</div>';return;}
 historyEl.innerHTML='';
 data.forEach(item=>{const el=document.createElement('div');el.className='card history-item';const status=String(item.status||'pending');el.innerHTML=`<div class="top"><div><div class="nominal">${rupiah(item.nominal)}</div><div class="meta">Request #${item.id}<br>Dibuat: ${new Date(item.created_at).toLocaleString('id-ID')}${item.reviewed_at?`<br>Diproses: ${new Date(item.reviewed_at).toLocaleString('id-ID')}`:''}</div></div><span class="status ${esc(status)}">${esc(status.toUpperCase())}</span></div>${item.rejection_reason?`<div class="reason"><b>Alasan:</b> ${esc(item.rejection_reason)}</div>`:''}`;historyEl.appendChild(el);});
}
loadHistory();
</script>
</body>
</html>
