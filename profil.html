<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profil Akun - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    nav {
      background: #111827;
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .logout {
      color: #fca5a5;
      cursor: pointer;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      margin-top: 18px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #111827;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .email-note {
      font-size: 13px;
      color: #666;
      margin-top: 6px;
    }
  </style>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

  <div class="brand">
    JaxGkv
  </div>

  <div class="links">
    <a href="index.html">Beranda</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="produk.html">Produk</a>
    <a href="topup.html">Top Up</a>
    <a href="notifikasi.html">🔔 Notifikasi</a>
    <a href="profil.html">Profil</a>
    <span class="logout" onclick="logout()">Logout</span>
  </div>

</nav>

<div class="container">

  <div class="card">

    <h1>👤 Profil Akun</h1>

    <p>Kelola informasi akun kamu.</p>

    <label for="name">
      Nama
    </label>

    <input
      type="text"
      id="name"
      placeholder="Masukkan nama"
    >

    <button onclick="updateName()">
      Simpan Nama
    </button>

    <div
      id="nameMessage"
      class="message"
    ></div>

  </div>


  <div class="card">

    <h2>📧 Ubah Email</h2>

    <label for="email">
      Email Baru
    </label>

    <input
      type="email"
      id="email"
      placeholder="Masukkan email baru"
    >

    <div class="email-note">
      Supabase mungkin meminta konfirmasi email baru.
    </div>

    <button onclick="updateEmail()">
      Ubah Email
    </button>

    <div
      id="emailMessage"
      class="message"
    ></div>

  </div>


  <div class="card">

    <h2>🔑 Ubah Password</h2>

    <label for="password">
      Password Baru
    </label>

    <input
      type="password"
      id="password"
      placeholder="Minimal 6 karakter"
    >

    <label for="passwordConfirm">
      Konfirmasi Password Baru
    </label>

    <input
      type="password"
      id="passwordConfirm"
      placeholder="Ulangi password baru"
    >

    <button onclick="updatePassword()">
      Ubah Password
    </button>

    <div
      id="passwordMessage"
      class="message"
    ></div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://evuwahoflentgidcjmsx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  function showMessage(
    elementId,
    message,
    success
  ) {

    const element =
      document.getElementById(elementId);

    element.textContent = message;

    element.className =
      "message " +
      (success ? "success" : "error");

    element.style.display =
      "block";

  }


  async function loadProfile() {

    const {
      data,
      error
    } = await supabaseClient.auth.getUser();

    if (
      error ||
      !data.user
    ) {

      window.location.href =
        "login.html";

      return;

    }

    const user =
      data.user;

    document.getElementById(
      "name"
    ).value =
      user.user_metadata?.full_name || "";

    document.getElementById(
      "email"
    ).value =
      user.email || "";

  }


  async function updateName() {

    const name =
      document.getElementById(
        "name"
      ).value.trim();


    if (!name) {

      showMessage(
        "nameMessage",
        "Nama tidak boleh kosong.",
        false
      );

      return;

    }


    const {
      error
    } = await supabaseClient.auth.updateUser({

      data: {
        full_name: name
      }

    });


    if (error) {

      showMessage(
        "nameMessage",
        "Gagal mengubah nama: " +
        error.message,
        false
      );

      return;

    }


    showMessage(
      "nameMessage",
      "Nama berhasil diperbarui.",
      true
    );

  }


  async function updateEmail() {

    const email =
      document.getElementById(
        "email"
      ).value.trim();


    if (!email) {

      showMessage(
        "emailMessage",
        "Email tidak boleh kosong.",
        false
      );

      return;

    }


    const {
      error
    } = await supabaseClient.auth.updateUser({

      email: email

    });


    if (error) {

      showMessage(
        "emailMessage",
        "Gagal mengubah email: " +
        error.message,
        false
      );

      return;

    }


    showMessage(
      "emailMessage",
      "Permintaan perubahan email berhasil. Cek email untuk konfirmasi jika diminta.",
      true
    );

  }


  async function updatePassword() {

    const password =
      document.getElementById(
        "password"
      ).value;

    const confirmPassword =
      document.getElementById(
        "passwordConfirm"
      ).value;


    if (password.length < 6) {

      showMessage(
        "passwordMessage",
        "Password minimal 6 karakter.",
        false
      );

      return;

    }


    if (password !== confirmPassword) {

      showMessage(
        "passwordMessage",
        "Konfirmasi password tidak cocok.",
        false
      );

      return;

    }


    const {
      error
    } = await supabaseClient.auth.updateUser({

      password: password

    });


    if (error) {

      showMessage(
        "passwordMessage",
        "Gagal mengubah password: " +
        error.message,
        false
      );

      return;

    }


    document.getElementById(
      "password"
    ).value = "";

    document.getElementById(
      "passwordConfirm"
    ).value = "";


    showMessage(
      "passwordMessage",
      "Password berhasil diubah.",
      true
    );

  }


  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "login.html";

  }


  loadProfile();

</script>

</body>
</html>
