<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b0b0b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: #151515;
      border: 1px solid #c9a227;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 0 25px rgba(201, 162, 39, 0.15);
    }

    h1 {
      text-align: center;
      color: #d4af37;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 17px;
      border-radius: 9px;
      border: 1px solid #444;
      background: #0d0d0d;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #d4af37;
      color: #111;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
    }

    .register {
      margin-top: 20px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }

    .register a {
      color: #d4af37;
      text-decoration: none;
    }
  </style>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <main class="auth-box">
    <h1>JaxGkv</h1>
    <p class="subtitle">Login ke akun kamu</p>

    <form id="loginForm">

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Masukkan email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan password"
        required
      >

      <button type="submit" id="loginButton">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="register">
      Belum punya akun?
      <a href="register.html">Daftar sekarang</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://evuwahoflentgidcjmsx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Login...";

      message.textContent = "";
      message.style.color = "#aaa";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        message.style.color = "#ff5555";

        loginButton.disabled = false;
        loginButton.textContent = "Login";
        return;
      }

      message.textContent = "Login berhasil!";
      message.style.color = "#4caf50";

      setTimeout(() => {
        window.location.href = "Dashboard.html";
      }, 800);
    });
  </script>

</body>
</html>
