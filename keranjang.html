<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keranjang - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    nav {
      background: #111;
      color: white;
      padding: 15px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      flex-wrap: wrap;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
    }

    .price {
      color: #555;
      margin-top: 5px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .minus,
    .plus {
      background: #eee;
    }

    .delete {
      background: #dc3545;
      color: white;
    }

    .checkout {
      width: 100%;
      background: #111;
      color: white;
      padding: 14px;
      font-size: 16px;
      margin-top: 10px;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      text-align: right;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 7px;
      display: none;
    }
  </style>
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>
  <a href="index.html">🏠 Beranda</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="produk.html">🛍️ Produk</a>
  <a href="keranjang.html">🛒 Keranjang</a>
  <a href="topup.html">💳 Top Up</a>
  <a href="riwayat-pembelian.html">📦 Riwayat Pembelian</a>
  <a href="notifikasi.html">🔔 Notifikasi</a>
  <a href="profil.html">👤 Profil</a>
  <a href="#" onclick="logout()">Logout</a>
</nav>

<div class="container">

  <h1>🛒 Keranjang Belanja</h1>

  <div id="message" class="message"></div>

  <div id="cartList">
    Memuat keranjang...
  </div>

  <div id="totalBox"></div>

</div>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let currentUser = null;
let currentTotal = 0;


// ===============================
// CEK LOGIN
// ===============================

async function checkLogin() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  loadCart();
}


// ===============================
// LOAD KERANJANG
// ===============================

async function loadCart() {

  const cartList =
    document.getElementById("cartList");

  cartList.innerHTML =
    "Memuat keranjang...";

  const {
    data,
    error
  } = await supabaseClient
    .from("cart_items")
    .select(`
      id,
      quantity,
      product_id,
      products (
        id,
        name,
        price
      )
    `)
    .eq("user_id", currentUser.id)
    .order("id", {
      ascending: false
    });

  if (error) {

    console.error(error);

    cartList.innerHTML =
      "<div class='card'>Gagal memuat keranjang.</div>";

    return;
  }

  if (!data || data.length === 0) {

    currentTotal = 0;

    cartList.innerHTML = `
      <div class="card empty">

        <h2>🛒 Keranjang masih kosong</h2>

        <p>
          Silakan pilih produk terlebih dahulu.
        </p>

        <a href="produk.html">
          Lihat Produk
        </a>

      </div>
    `;

    document.getElementById(
      "totalBox"
    ).innerHTML = "";

    return;
  }

  let total = 0;

  cartList.innerHTML = "";

  data.forEach(item => {

    const product = item.products;

    if (!product) return;

    const subtotal =
      product.price * item.quantity;

    total += subtotal;

    const div =
      document.createElement("div");

    div.className = "card";

    div.innerHTML = `
      <div class="item">

        <div>

          <div class="name">
            ${escapeHtml(product.name)}
          </div>

          <div class="price">
            Rp ${formatRupiah(product.price)}
          </div>

          <div>
            Subtotal:
            <b>
              Rp ${formatRupiah(subtotal)}
            </b>
          </div>

        </div>

        <div class="quantity">

          <button
            class="minus"
            onclick="changeQuantity(
              ${item.id},
              ${item.quantity - 1}
            )">
            −
          </button>

          <b>${item.quantity}</b>

          <button
            class="plus"
            onclick="changeQuantity(
              ${item.id},
              ${item.quantity + 1}
            )">
            +
          </button>

          <button
            class="delete"
            onclick="removeItem(${item.id})">
            🗑️
          </button>

        </div>

      </div>
    `;

    cartList.appendChild(div);

  });

  currentTotal = total;

  document.getElementById(
    "totalBox"
  ).innerHTML = `

    <div class="card">

      <div class="total">
        Total:
        Rp ${formatRupiah(total)}
      </div>

      <button
        class="checkout"
        onclick="checkoutCart()">

        💳 Checkout

      </button>

    </div>

  `;
}


// ===============================
// UBAH JUMLAH
// ===============================

async function changeQuantity(
  cartId,
  quantity
) {

  const {
    error
  } = await supabaseClient.rpc(
    "update_cart_quantity",
    {
      p_cart_id: cartId,
      p_quantity: quantity
    }
  );

  if (error) {

    alert(error.message);

    return;
  }

  loadCart();
}


// ===============================
// HAPUS ITEM
// ===============================

async function removeItem(cartId) {

  const yakin =
    confirm(
      "Hapus produk dari keranjang?"
    );

  if (!yakin) return;

  const {
    error
  } = await supabaseClient.rpc(
    "remove_from_cart",
    {
      p_cart_id: cartId
    }
  );

  if (error) {

    alert(error.message);

    return;
  }

  loadCart();
}


// ===============================
// CHECKOUT
// ===============================

async function checkoutCart() {

  if (currentTotal <= 0) {

    alert(
      "Keranjang masih kosong."
    );

    return;
  }

  const yakin =
    confirm(
      "Checkout sekarang?\n\n" +
      "Total: Rp " +
      formatRupiah(currentTotal)
    );

  if (!yakin) return;

  const button =
    document.querySelector(".checkout");

  if (button) {

    button.disabled = true;

    button.textContent =
      "Memproses checkout...";

  }

  const {
    data,
    error
  } = await supabaseClient.rpc(
    "checkout_cart"
  );

  if (error) {

    alert(
      "Checkout gagal:\n" +
      error.message
    );

    loadCart();

    return;
  }

  alert(
    "✅ Checkout berhasil!\n\n" +
    "Total: Rp " +
    formatRupiah(data.total) +
    "\nPesanan: " +
    data.purchase_count
  );

  window.location.href =
    "riwayat-pembelian.html";
}


// ===============================
// FORMAT RUPIAH
// ===============================

function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID"
  ).format(number);

}


// ===============================
// AMANKAN TEKS
// ===============================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


// ===============================
// LOGOUT
// ===============================

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";
}


// ===============================
// START
// ===============================

checkLogin();

</script>

</body>
</html>
