<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Detail Pesanan - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      font-size: 20px;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .back {
      display: inline-block;
      margin-bottom: 15px;
      color: #111;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .loading,
    .error {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
    }

    .error {
      color: #c00;
    }

    .order-code {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .item {
      border-top: 1px solid #eee;
      padding: 16px 0;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .info {
      line-height: 1.7;
      color: #555;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #eee;
      font-size: 13px;
      font-weight: bold;
    }

    .completed {
      background: #d9f7df;
      color: #187a2f;
    }

    .pending {
      background: #fff0c2;
      color: #8a6500;
    }

    .btn {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 15px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      background: #1769ff;
      color: white;
    }

    .total {
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 5px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  JaxGkv — Detail Pesanan
</header>

<div class="container">

  <a class="back" href="riwayat-pembelian.html">
    ← Kembali ke Riwayat
  </a>

  <div id="content">
    <div class="loading">
      Memuat detail pesanan...
    </div>
  </div>

</div>

<script>
  const SUPABASE_URL =
    "https://evuwahoflentgidcjmsx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  const content =
    document.getElementById("content");


  function formatRupiah(value) {
    return new Intl.NumberFormat("id-ID", {
      style: "currency",
      currency: "IDR",
      minimumFractionDigits: 0
    }).format(Number(value) || 0);
  }


  function formatDate(value) {

    if (!value) return "-";

    return new Date(value).toLocaleString(
      "id-ID",
      {
        dateStyle: "medium",
        timeStyle: "short"
      }
    );
  }


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  async function loadDetail() {

    try {

      /*
       * 1. CEK LOGIN
       */

      const {
        data: {
          session
        },
        error: sessionError
      } =
        await supabaseClient.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      if (!session) {

        content.innerHTML = `
          <div class="error">
            ❌ Kamu belum login.
            <br><br>
            <a class="btn" href="login.html">
              Login
            </a>
          </div>
        `;

        return;
      }


      const user = session.user;


      /*
       * 2. AMBIL PARAMETER URL
       */

      const params =
        new URLSearchParams(
          window.location.search
        );

      const purchaseId =
        params.get("purchase");

      const orderCode =
        params.get("order");


      /*
       * 3. HARUS ADA purchase ATAU order
       */

      if (!purchaseId && !orderCode) {

        content.innerHTML = `
          <div class="error">
            ❌ ID pesanan tidak ditemukan.
          </div>
        `;

        return;
      }


      let purchases = [];


      /*
       * 4. JIKA ADA ?purchase=12
       *
       * LANGSUNG CARI ID PURCHASE
       */

      if (purchaseId) {

        const numericId =
          Number(purchaseId);


        if (
          !Number.isInteger(numericId) ||
          numericId <= 0
        ) {

          content.innerHTML = `
            <div class="error">
              ❌ ID pembelian tidak valid.
            </div>
          `;

          return;
        }


        const {
          data,
          error
        } =
          await supabaseClient
            .from("purchases")
            .select(`
              id,
              user_id,
              product_id,
              product_name,
              price,
              created_at,
              status,
              quantity,
              order_code
            `)
            .eq("id", numericId)
            .eq("user_id", user.id)
            .maybeSingle();


        if (error) {

          console.error(
            "ERROR PURCHASE:",
            error
          );

          throw error;
        }


        if (data) {
          purchases = [data];
        }

      }


      /*
       * 5. JIKA ADA ?order=JX-000003
       */

      else if (orderCode) {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("purchases")
            .select(`
              id,
              user_id,
              product_id,
              product_name,
              price,
              created_at,
              status,
              quantity,
              order_code
            `)
            .eq("order_code", orderCode)
            .eq("user_id", user.id)
            .order("created_at", {
              ascending: true
            });


        if (error) {

          console.error(
            "ERROR ORDER:",
            error
          );

          throw error;
        }


        purchases = data || [];
      }


      /*
       * 6. KALAU TETAP KOSONG
       */

      if (!purchases.length) {

        content.innerHTML = `
          <div class="error">

            ❌ Pesanan tidak ditemukan.

            <br><br>

            <small>
              User: ${escapeHtml(user.id)}
              <br>
              Purchase ID:
              ${escapeHtml(purchaseId || "-")}
              <br>
              Order Code:
              ${escapeHtml(orderCode || "-")}
            </small>

          </div>
        `;

        return;
      }


      /*
       * 7. KODE PESANAN
       */

      const first =
        purchases[0];

      const displayCode =
        first.order_code &&
        String(first.order_code).trim() !== ""
          ? first.order_code
          : "PURCHASE-" + first.id;


      /*
       * 8. RENDER ITEM
       */

      let itemsHtml = "";

      let grandTotal = 0;


      purchases.forEach(item => {

        const price =
          Number(item.price) || 0;

        const quantity =
          Number(item.quantity) || 1;

        const subtotal =
          price * quantity;

        grandTotal += subtotal;


        const status =
          String(item.status || "")
            .toLowerCase();


        itemsHtml += `

          <div class="item">

            <div class="product-name">
              ${escapeHtml(
                item.product_name || "Produk"
              )}
            </div>

            <div class="info">

              Harga:
              ${formatRupiah(price)}

              <br>

              Jumlah:
              ${quantity}

              <br>

              Subtotal:
              ${formatRupiah(subtotal)}

              <br>

              Waktu:
              ${formatDate(
                item.created_at
              )}

            </div>


            <span class="status ${status}">
              ${escapeHtml(
                item.status || "-"
              )}
            </span>


            ${
              item.status === "completed" &&
              item.product_id
                ? `
                  <br>

                  <a
                    class="btn"
                    href="video.html?id=${encodeURIComponent(
                      item.product_id
                    )}"
                  >
                    🎬 Tonton Video
                  </a>
                `
                : ""
            }

          </div>

        `;
      });


      /*
       * 9. TAMPILKAN
       */

      content.innerHTML = `

        <div class="card">

          <div class="order-code">
            ${escapeHtml(displayCode)}
          </div>

          <div class="date">
            ${formatDate(
              first.created_at
            )}
          </div>

          ${itemsHtml}

          <div class="total">
            Total:
            ${formatRupiah(grandTotal)}
          </div>

        </div>

      `;

    }

    catch (error) {

      console.error(error);

      content.innerHTML = `

        <div class="error">

          ❌ Gagal memuat pesanan.

          <br><br>

          ${escapeHtml(
            error.message ||
            String(error)
          )}

        </div>

      `;
    }
  }


  loadDetail();

</script>

</body>
</html>
