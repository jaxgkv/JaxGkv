<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Pesanan - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      color: #111827;
    }

    nav {
      background: #111827;
      padding: 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a,
    nav button {
      color: white;
      text-decoration: none;
      background: #374151;
      border: none;
      padding: 9px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .order-id {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
      word-break: break-word;
    }

    .date {
      color: #6b7280;
      margin-top: 6px;
      font-size: 14px;
    }

    .item {
      border-bottom: 1px solid #e5e7eb;
      padding: 15px 0;
    }

    .item:last-child {
      border-bottom: none;
    }

    .product {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .detail {
      color: #4b5563;
      margin: 4px 0;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 7px;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .processing {
      background: #dbeafe;
      color: #1e40af;
    }

    .completed {
      background: #dcfce7;
      color: #166534;
    }

    .cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .total {
      text-align: right;
      font-size: 20px;
      font-weight: bold;
      border-top: 2px solid #e5e7eb;
      padding-top: 15px;
      margin-top: 10px;
    }

    .back-button {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 7px;
    }

    .video-button {
      display: inline-block;
      margin-top: 10px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 9px 13px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .loading,
    .error {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #b91c1c;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Beranda</a>
  <a href="dashboard.html">📊 Dashboard</a>
  <a href="produk.html">🛍️ Produk</a>
  <a href="keranjang.html">🛒 Keranjang</a>
  <a href="topup.html">💰 Top Up</a>
  <a href="riwayat-pembelian.html">🧾 Riwayat Pembelian</a>
  <a href="notifikasi.html">🔔 Notifikasi</a>
  <a href="profil.html">👤 Profil</a>
  <button onclick="logout()">Logout</button>
</nav>

<div class="container">

  <div id="loading" class="loading">
    Memuat detail pesanan...
  </div>

  <div id="content"></div>

</div>

<script>
const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function formatRupiah(value) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}


function formatDate(date) {
  if (!date) {
    return "-";
  }

  return new Date(date).toLocaleString("id-ID", {
    dateStyle: "medium",
    timeStyle: "short"
  });
}


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function statusHTML(status) {

  if (status === "processing") {
    return `
      <span class="status processing">
        ⚙️ Processing
      </span>
    `;
  }

  if (status === "completed") {
    return `
      <span class="status completed">
        ✅ Completed
      </span>
    `;
  }

  if (status === "cancelled") {
    return `
      <span class="status cancelled">
        ❌ Cancelled
      </span>
    `;
  }

  return `
    <span class="status pending">
      🕐 Pending
    </span>
  `;
}


async function loadDetail() {

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");


  const {
    data: sessionData,
    error: sessionError
  } =
    await supabaseClient.auth.getSession();


  if (
    sessionError ||
    !sessionData.session
  ) {
    window.location.href = "login.html";
    return;
  }


  const user =
    sessionData.session.user;


  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   * Prioritas:
   * 1. purchase = ID purchases
   * 2. order = order_code lama
   */

  const purchaseId =
    params.get("purchase");

  const orderCode =
    params.get("order");


  let data = null;
  let error = null;


  // =========================================
  // CARI BERDASARKAN PURCHASE ID
  // =========================================

  if (purchaseId) {

    const result =
      await supabaseClient
        .from("purchases")
        .select(`
          id,
          user_id,
          order_code,
          product_id,
          product_name,
          price,
          quantity,
          status,
          created_at
        `)
        .eq("id", purchaseId)
        .eq("user_id", user.id)
        .maybeSingle();

    data =
      result.data
        ? [result.data]
        : [];

    error =
      result.error;
  }


  // =========================================
  // KALAU TIDAK ADA PURCHASE ID,
  // CARI BERDASARKAN ORDER CODE
  // =========================================

  else if (orderCode) {

    const result =
      await supabaseClient
        .from("purchases")
        .select(`
          id,
          user_id,
          order_code,
          product_id,
          product_name,
          price,
          quantity,
          status,
          created_at
        `)
        .eq("user_id", user.id)
        .eq("order_code", orderCode)
        .order("created_at", {
          ascending: true
        });

    data =
      result.data;

    error =
      result.error;
  }


  // =========================================
  // TIDAK ADA PARAMETER
  // =========================================

  else {

    loading.style.display = "none";

    content.innerHTML = `
      <div class="card error">
        ❌ ID pesanan tidak ditemukan.
      </div>
    `;

    return;
  }


  loading.style.display = "none";


  if (error) {

    content.innerHTML = `
      <div class="card error">
        ❌ Gagal memuat pesanan.
        <br><br>
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    content.innerHTML = `
      <div class="card error">
        ❌ Pesanan tidak ditemukan.
      </div>
    `;

    return;
  }


  // =========================================
  // HITUNG TOTAL
  // =========================================

  let total = 0;

  data.forEach(item => {

    total +=
      Number(item.price || 0) *
      Number(item.quantity || 1);

  });


  const first =
    data[0];


  /*
   * Kalau order_code kosong,
   * tampilkan ID purchase sebagai nomor pesanan.
   */

  const displayOrderCode =
    first.order_code &&
    first.order_code.trim()
      ? first.order_code
      : "PURCHASE-" + first.id;


  let itemsHTML = "";


  data.forEach(item => {

    const quantity =
      Number(item.quantity || 1);

    const subtotal =
      Number(item.price || 0) *
      quantity;


    let videoHTML = "";


    if (
      item.status === "completed" &&
      item.product_id
    ) {

      videoHTML = `
        <a
          class="video-button"
          href="video.html?id=${encodeURIComponent(item.product_id)}"
        >
          🎬 Tonton Video
        </a>
      `;
    }


    itemsHTML += `
      <div class="item">

        <div class="product">
          ${escapeHtml(item.product_name)}
        </div>

        <div class="detail">
          Harga:
          ${formatRupiah(item.price)}
        </div>

        <div class="detail">
          Jumlah:
          ${quantity}
        </div>

        <div class="detail">
          Subtotal:
          ${formatRupiah(subtotal)}
        </div>

        ${statusHTML(item.status)}

        ${videoHTML}

      </div>
    `;
  });


  content.innerHTML = `

    <div class="card">

      <div class="order-id">
        📦 ${escapeHtml(displayOrderCode)}
      </div>

      <div class="date">
        Dibuat:
        ${formatDate(first.created_at)}
      </div>

    </div>


    <div class="card">

      <h2>🛍️ Produk Pesanan</h2>

      ${itemsHTML}

      <div class="total">
        Total Pesanan:
        ${formatRupiah(total)}
      </div>

    </div>


    <div class="card">

      <a
        class="back-button"
        href="riwayat-pembelian.html"
      >
        ← Kembali ke Riwayat Pembelian
      </a>

    </div>
  `;
}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";
}


loadDetail();
</script>

</body>
</html>
