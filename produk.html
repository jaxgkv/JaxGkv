<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Produk - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    nav {
      background: #111;
      color: white;
      padding: 15px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product h3 {
      margin-top: 0;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
    }

    .cart-btn {
      background: #111;
      color: white;
    }

    .buy-btn {
      background: #eee;
      color: #111;
    }

    .cart-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }
  </style>
</head>

<body>

<nav>
  <a href="index.html">🏠 Beranda</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="produk.html">🛍️ Produk</a>
  <a href="keranjang.html">🛒 Keranjang</a>
  <a href="topup.html">💳 Top Up</a>
  <a href="riwayat-pembelian.html">📦 Riwayat Pembelian</a>
  <a href="notifikasi.html">🔔 Notifikasi</a>
  <a href="profil.html">👤 Profil</a>
  <a href="#" onclick="logout()">Logout</a>
</nav>

<div class="container">

  <h1>🛍️ Daftar Produk</h1>

  <a class="cart-link" href="keranjang.html">
    🛒 Lihat Keranjang
  </a>

  <div id="productList" class="products">
    Memuat produk...
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;


// ===============================
// CEK LOGIN
// ===============================

async function checkLogin() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;

  loadProducts();
}


// ===============================
// LOAD PRODUK
// ===============================

async function loadProducts() {

  const productList =
    document.getElementById("productList");

  const {
    data,
    error
  } = await supabaseClient
    .from("products")
    .select("id,name,price")
    .order("id", {
      ascending: true
    });


  if (error) {

    console.error(error);

    productList.innerHTML =
      "<p>Gagal memuat produk.</p>";

    return;
  }


  if (!data || data.length === 0) {

    productList.innerHTML =
      "<p>Belum ada produk.</p>";

    return;
  }


  productList.innerHTML = "";


  data.forEach(product => {

    const div =
      document.createElement("div");

    div.className = "product";


    div.innerHTML = `

      <h3>
        ${escapeHtml(product.name)}
      </h3>

      <div class="price">
        Rp ${formatRupiah(product.price)}
      </div>

      <button
        class="cart-btn"
        onclick="addToCart(${product.id})">

        🛒 Tambah ke Keranjang

      </button>

      <button
        class="buy-btn"
        onclick="buyProduct(${product.id})">

        ⚡ Beli Sekarang

      </button>

    `;


    productList.appendChild(div);

  });

}


// ===============================
// TAMBAH KE KERANJANG
// ===============================

async function addToCart(productId) {

  const {
    error
  } = await supabaseClient.rpc(
    "add_to_cart",
    {
      p_product_id: productId,
      p_quantity: 1
    }
  );


  if (error) {

    alert(
      "Gagal menambahkan ke keranjang:\n" +
      error.message
    );

    return;
  }


  alert(
    "✅ Produk berhasil ditambahkan ke keranjang!"
  );

}


// ===============================
// BELI SEKARANG
// ===============================

async function buyProduct(productId) {

  const yakin =
    confirm(
      "Yakin ingin membeli produk ini?"
    );

  if (!yakin) return;


  const {
    data,
    error
  } = await supabaseClient.rpc(
    "buy_product",
    {
      p_product_id: productId
    }
  );


  if (error) {

    alert(
      "Pembelian gagal:\n" +
      error.message
    );

    return;
  }


  alert(
    "✅ Pembelian berhasil!"
  );


  window.location.href =
    "riwayat-pembelian.html";

}


// ===============================
// FORMAT RUPIAH
// ===============================

function formatRupiah(number) {

  return new Intl.NumberFormat(
    "id-ID"
  ).format(number);

}


// ===============================
// AMANKAN NAMA PRODUK
// ===============================

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


// ===============================
// LOGOUT
// ===============================

async function logout() {

  await supabaseClient.auth.signOut();

  window.location.href =
    "login.html";

}


// ===============================
// START
// ===============================

checkLogin();

</script>

</body>
</html>
