<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JaxGkv — Produk</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .products {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      padding: 25px;
      border-radius: 15px;
      background: #111827;
      border: 1px solid #263244;
    }

    .product-card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }

    .loading {
      text-align: center;
      margin: 50px;
    }

    .error {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
      background: #3f1515;
      border: 1px solid #ef4444;
      border-radius: 12px;
      color: white;
    }

    .buy-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    .buy-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

<header class="navbar">
  <div class="logo">Jax<span>Gkv</span></div>

  <nav>
    <a href="index.html">Beranda</a>
    <a href="produk.html">Produk</a>
    <a href="topup.html">Top Up</a>
    <a href="riwayat-topup.html">Riwayat</a>
  </nav>
</header>

<main>

  <h1 style="text-align:center; margin-top:40px;">
    Produk JaxGkv
  </h1>

  <div id="loading" class="loading">
    Memuat produk...
  </div>

  <div id="error" class="error" style="display:none;"></div>

  <section id="products" class="products"></section>

</main>

<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


async function loadProducts() {

  const loading = document.getElementById("loading");
  const container = document.getElementById("products");
  const errorBox = document.getElementById("error");

  const { data, error } = await supabaseClient
    .from("products")
    .select("id, name, price")
    .order("id", { ascending: true });

  loading.style.display = "none";

  if (error) {

    errorBox.style.display = "block";

    errorBox.innerHTML = `
      <strong>Gagal memuat produk.</strong>
      <br><br>
      ${error.message}
    `;

    return;
  }

  if (!data || data.length === 0) {

    container.innerHTML = `
      <p style="text-align:center;">
        Tidak ada produk.
      </p>
    `;

    return;
  }


  data.forEach(product => {

    const card = document.createElement("div");

    card.className = "product-card";

    card.innerHTML = `
      <h2>${product.name}</h2>

      <div class="price">
        Rp${Number(product.price).toLocaleString("id-ID")}
      </div>

      <button
        class="buy-btn"
        onclick="beli(${product.id})">
        Beli
      </button>
    `;

    container.appendChild(card);

  });

}


async function beli(id) {

  const { data: sessionData } =
    await supabaseClient.auth.getSession();

  if (!sessionData.session) {

    alert("Silakan login terlebih dahulu.");

    return;
  }


  const { data, error } =
    await supabaseClient.rpc("buy_product", {
      p_product_id: id
    });


  if (error) {

    alert(
      "Gagal membeli:\n" +
      error.message
    );

    return;
  }


  if (!data || !data.success) {

    alert(
      data?.message ||
      "Pembelian gagal."
    );

    return;
  }


  alert(
    "Pembelian berhasil!\n\n" +
    data.product +
    "\nHarga: Rp" +
    Number(data.price).toLocaleString("id-ID")
  );


  location.reload();

}


loadProducts();

</script>

</body>
</html>
