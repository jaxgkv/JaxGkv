<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Banner - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-warning {
      background: #d97706;
      color: white;
    }

    .banner-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .banner-item img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .active {
      background: #dcfce7;
      color: #166534;
    }

    .inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    #message {
      margin-bottom: 15px;
      font-weight: bold;
    }

    .edit-box {
      display: none;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .edit-box.show {
      display: block;
    }

    .empty {
      color: #666;
      text-align: center;
      padding: 25px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 25px;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      color: #166534;
      background: #dcfce7;
      padding: 12px;
      border-radius: 8px;
    }

    .url-text {
      word-break: break-all;
      color: #555;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        margin-top: 15px;
      }

      .card {
        padding: 15px;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🎨 Admin Banner - JaxGkv</h1>
</header>

<div class="container">

  <!-- ========================= -->
  <!-- TAMBAH BANNER -->
  <!-- ========================= -->

  <div class="card">

    <h2>➕ Tambah Banner</h2>

    <div id="message"></div>

    <label for="title">
      Judul
    </label>

    <input
      id="title"
      type="text"
      placeholder="Contoh: Promo Terbaru"
      maxlength="150"
    >

    <label for="description">
      Deskripsi
    </label>

    <textarea
      id="description"
      placeholder="Deskripsi banner"
      maxlength="1000"
    ></textarea>

    <label for="image_url">
      URL Gambar
    </label>

    <input
      id="image_url"
      type="text"
      placeholder="https://..."
    >

    <small>
      Gunakan URL gambar dengan http:// atau https://
    </small>

    <br><br>

    <label for="link_url">
      URL Tujuan
    </label>

    <input
      id="link_url"
      type="text"
      placeholder="produk.html atau https://..."
    >

    <small>
      Contoh: produk.html
    </small>

    <br><br>

    <button
      id="addBannerBtn"
      class="btn-primary"
      onclick="addBanner()"
    >
      ➕ Tambah Banner
    </button>

  </div>


  <!-- ========================= -->
  <!-- DAFTAR BANNER -->
  <!-- ========================= -->

  <div class="card">

    <h2>📋 Daftar Banner</h2>

    <button
      class="btn-secondary"
      onclick="loadBanners()"
    >
      🔄 Refresh
    </button>

    <br><br>

    <div id="bannerList">
      <div class="loading">
        Memuat banner...
      </div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://evuwahoflentgidcjmsx.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ======================================
// CEK ADMIN
// ======================================

async function checkAdmin() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();


  if (error || !user) {

    alert("Silakan login terlebih dahulu.");

    location.href = "login.html";

    return false;
  }


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();


  if (
    profileError ||
    !profile ||
    profile.role !== "admin"
  ) {

    alert("Akses hanya untuk admin.");

    location.href = "dashboard.html";

    return false;
  }


  return true;
}


// ======================================
// LOAD BANNER
// ======================================

async function loadBanners() {

  const list =
    document.getElementById("bannerList");


  list.innerHTML = `
    <div class="loading">
      Memuat banner...
    </div>
  `;


  const {
    data,
    error
  } =
    await supabaseClient
      .from("banners")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    console.error(error);

    list.innerHTML = `
      <div class="error">
        Gagal memuat banner:
        ${escapeHtml(error.message)}
      </div>
    `;

    return;
  }


  if (!data || data.length === 0) {

    list.innerHTML = `
      <div class="empty">
        Belum ada banner.
      </div>
    `;

    return;
  }


  list.innerHTML =
    data.map(renderBanner).join("");
}


// ======================================
// RENDER BANNER
// ======================================

function renderBanner(banner) {

  const image =
    banner.image_url
      ? `
        <img
          src="${escapeAttribute(banner.image_url)}"
          alt="${escapeAttribute(banner.title)}"
          onerror="this.style.display='none'"
        >
      `
      : "";


  const link =
    banner.link_url
      ? `
        <p class="url-text">
          🔗
          ${escapeHtml(banner.link_url)}
        </p>
      `
      : "";


  return `
    <div
      class="banner-item"
      id="banner-${Number(banner.id)}"
    >

      ${image}

      <span
        class="status ${
          banner.is_active
            ? "active"
            : "inactive"
        }"
      >
        ${
          banner.is_active
            ? "AKTIF"
            : "NONAKTIF"
        }
      </span>

      <h3>
        ${escapeHtml(banner.title)}
      </h3>

      <p>
        ${escapeHtml(
          banner.description
        )}
      </p>

      ${link}


      <div class="actions">

        <button
          class="btn-primary"
          onclick="showEditBanner(
            ${Number(banner.id)}
          )"
        >
          ✏️ Edit
        </button>


        <button
          class="${
            banner.is_active
              ? "btn-secondary"
              : "btn-primary"
          }"
          onclick="toggleBanner(
            ${Number(banner.id)},
            ${Boolean(banner.is_active)}
          )"
        >
          ${
            banner.is_active
              ? "Nonaktifkan"
              : "Aktifkan"
          }
        </button>


        <button
          class="btn-danger"
          onclick="deleteBanner(
            ${Number(banner.id)}
          )"
        >
          🗑️ Hapus
        </button>

      </div>


      <!-- FORM EDIT -->

      <div
        class="edit-box"
        id="edit-${Number(banner.id)}"
      >

        <h3>
          ✏️ Edit Banner
        </h3>


        <label>
          Judul
        </label>

        <input
          id="edit-title-${Number(banner.id)}"
          type="text"
          value="${escapeAttribute(
            banner.title
          )}"
          maxlength="150"
        >


        <label>
          Deskripsi
        </label>

        <textarea
          id="edit-description-${Number(banner.id)}"
          maxlength="1000"
        >${escapeHtml(
          banner.description
        )}</textarea>


        <label>
          URL Gambar
        </label>

        <input
          id="edit-image-${Number(banner.id)}"
          type="text"
          value="${escapeAttribute(
            banner.image_url
          )}"
        >


        <label>
          URL Tujuan
        </label>

        <input
          id="edit-link-${Number(banner.id)}"
          type="text"
          value="${escapeAttribute(
            banner.link_url
          )}"
        >


        <div class="actions">

          <button
            class="btn-primary"
            onclick="saveBanner(
              ${Number(banner.id)}
            )"
          >
            💾 Simpan
          </button>


          <button
            class="btn-secondary"
            onclick="hideEditBanner(
              ${Number(banner.id)}
            )"
          >
            Batal
          </button>

        </div>

      </div>

    </div>
  `;
}


// ======================================
// TAMBAH BANNER
// ======================================

async function addBanner() {

  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const image_url =
    document
      .getElementById("image_url")
      .value
      .trim();


  const link_url =
    document
      .getElementById("link_url")
      .value
      .trim();


  const message =
    document.getElementById("message");


  const button =
    document.getElementById(
      "addBannerBtn"
    );


  message.className = "";
  message.textContent = "";


  if (!title) {

    message.className = "error";

    message.textContent =
      "Judul banner wajib diisi.";

    return;
  }


  button.disabled = true;

  button.textContent =
    "⏳ Menambahkan...";


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_add_banner",
      {
        p_title: title,
        p_description: description,
        p_image_url: image_url,
        p_link_url: link_url,
        p_is_active: true
      }
    );


  button.disabled = false;

  button.textContent =
    "➕ Tambah Banner";


  if (error) {

    console.error(error);

    message.className = "error";

    message.textContent =
      "Gagal menambah banner: " +
      error.message;

    return;
  }


  if (
    !data ||
    data.success !== true
  ) {

    message.className = "error";

    message.textContent =
      "Banner gagal ditambahkan.";

    return;
  }


  message.className =
    "success";

  message.textContent =
    "Banner berhasil ditambahkan.";


  document.getElementById(
    "title"
  ).value = "";


  document.getElementById(
    "description"
  ).value = "";


  document.getElementById(
    "image_url"
  ).value = "";


  document.getElementById(
    "link_url"
  ).value = "";


  await loadBanners();
}


// ======================================
// TAMPILKAN FORM EDIT
// ======================================

function showEditBanner(id) {

  const box =
    document.getElementById(
      `edit-${id}`
    );


  if (!box) {
    return;
  }


  box.classList.add("show");


  box.scrollIntoView({
    behavior: "smooth",
    block: "center"
  });
}


// ======================================
// SEMBUNYIKAN FORM EDIT
// ======================================

function hideEditBanner(id) {

  const box =
    document.getElementById(
      `edit-${id}`
    );


  if (!box) {
    return;
  }


  box.classList.remove("show");
}


// ======================================
// SIMPAN EDIT BANNER
// ======================================

async function saveBanner(id) {

  const title =
    document
      .getElementById(
        `edit-title-${id}`
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        `edit-description-${id}`
      )
      .value
      .trim();


  const image_url =
    document
      .getElementById(
        `edit-image-${id}`
      )
      .value
      .trim();


  const link_url =
    document
      .getElementById(
        `edit-link-${id}`
      )
      .value
      .trim();


  if (!title) {

    alert(
      "Judul banner wajib diisi."
    );

    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "admin_update_banner",
      {
        p_id: id,
        p_title: title,
        p_description: description,
        p_image_url: image_url,
        p_link_url: link_url,
        p_is_active: true
      }
    );


  if (error) {

    console.error(error);

    alert(
      "Gagal mengedit banner: " +
      error.message
    );

    return;
  }


  if (
    !data ||
    data.success !== true
  ) {

    alert(
      "Banner gagal diperbarui."
    );

    return;
  }


  alert(
    "Banner berhasil diperbarui."
  );


  await loadBanners();
}


// ======================================
// TOGGLE BANNER
// ======================================

async function toggleBanner(
  id,
  currentStatus
) {

  const newStatus =
    !currentStatus;


  const {
    error
  } =
    await supabaseClient
      .from("banners")
      .update({
        is_active: newStatus
      })
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "Gagal mengubah status: " +
      error.message
    );

    return;
  }


  await loadBanners();
}


// ======================================
// HAPUS BANNER
// ======================================

async function deleteBanner(id) {

  const confirmed =
    confirm(
      "Yakin ingin menghapus banner ini?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("banners")
      .delete()
      .eq("id", id);


  if (error) {

    console.error(error);

    alert(
      "Gagal menghapus banner: " +
      error.message
    );

    return;
  }


  alert(
    "Banner berhasil dihapus."
  );


  await loadBanners();
}


// ======================================
// ESCAPE HTML
// ======================================

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


// ======================================
// ESCAPE ATTRIBUTE
// ======================================

function escapeAttribute(value) {

  return escapeHtml(value);
}


// ======================================
// INIT
// ======================================

(async function init() {

  const allowed =
    await checkAdmin();


  if (allowed) {

    await loadBanners();

  }

})();

</script>

</body>
</html>
