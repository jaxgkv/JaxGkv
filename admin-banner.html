<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Banner - JaxGkv</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    nav {
      background: #111827;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 21px;
      font-weight: bold;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      padding: 8px 11px;
      border-radius: 7px;
      background: #1f2937;
      font-size: 14px;
    }

    .nav-links a:hover {
      background: #374151;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    label {
      display: block;
      margin-top: 13px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 15px;
    }

    .checkbox-row input {
      width: auto;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn-warning {
      background: #f59e0b;
      color: white;
    }

    .btn-danger {
      background: #dc2626;
      color: white;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 13px;
    }

    .banner-list {
      display: grid;
      gap: 15px;
    }

    .banner-item {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      background: #fff;
    }

    .banner-top {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .banner-info {
      flex: 1;
    }

    .banner-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .banner-description {
      color: #6b7280;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .banner-image {
      width: 220px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background: #e5e7eb;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .badge-active {
      background: #dcfce7;
      color: #166534;
    }

    .badge-inactive {
      background: #fee2e2;
      color: #991b1b;
    }

    .banner-url {
      font-size: 13px;
      color: #6b7280;
      word-break: break-all;
      margin-top: 7px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .edit-form {
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .error-box {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success-box {
      background: #dcfce7;
      color: #166534;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 700px) {
      .banner-top {
        flex-direction: column;
      }

      .banner-image {
        width: 100%;
        height: 180px;
      }

      .nav-links {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="brand">⚙️ JaxGkv Admin</div>

    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="admin-produk.html">Produk</a>
      <a href="admin-pembelian.html">Pembelian</a>
      <a href="admin-banner.html">Banner</a>
      <a href="index.html">Beranda</a>
    </div>
  </nav>

  <div class="container">

    <h1>🖼️ Kelola Banner</h1>

    <div id="message"></div>

    <!-- TAMBAH BANNER -->
    <div class="card">
      <h2>➕ Tambah Banner</h2>

      <form id="addBannerForm">

        <label for="title">Judul Banner</label>
        <input
          type="text"
          id="title"
          maxlength="150"
          required
          placeholder="Contoh: Promo Top Up"
        >

        <label for="description">Deskripsi</label>
        <textarea
          id="description"
          maxlength="1000"
          placeholder="Deskripsi banner..."
        ></textarea>

        <label for="image_url">Image URL</label>
        <input
          type="url"
          id="image_url"
          placeholder="https://example.com/banner.jpg"
        >

        <label for="link_url">Link URL</label>
        <input
          type="text"
          id="link_url"
          placeholder="produk.html atau https://example.com"
        >

        <div class="checkbox-row">
          <input type="checkbox" id="is_active" checked>
          <label for="is_active" style="margin:0;">
            Aktifkan banner
          </label>
        </div>

        <br>

        <button type="submit" class="btn-primary" id="addButton">
          ➕ Tambah Banner
        </button>

      </form>
    </div>


    <!-- DAFTAR BANNER -->
    <div class="card">
      <h2>📋 Daftar Banner</h2>

      <div id="bannerList">
        <div class="loading">
          Memuat banner...
        </div>
      </div>
    </div>

  </div>


<script>
  const SUPABASE_URL =
    "https://evuwahoflentgidcjmsx.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_77o85YPI70oY-d7GJ6Yi2A_HGg4afR3";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * =====================================================
   * HELPER
   * =====================================================
   */

  function showMessage(message, type = "success") {
    const el = document.getElementById("message");

    el.innerHTML = `
      <div class="${type === "error" ? "error-box" : "success-box"}">
        ${escapeHtml(message)}
      </div>
    `;

    setTimeout(() => {
      el.innerHTML = "";
    }, 4000);
  }


  function escapeHtml(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function escapeAttribute(value) {
    return escapeHtml(value);
  }


  /*
   * =====================================================
   * VALIDASI URL
   * =====================================================
   */

  function isValidImageUrl(value) {
    if (!value) return true;

    try {
      const url = new URL(value);

      return (
        url.protocol === "http:" ||
        url.protocol === "https:"
      );
    } catch {
      return false;
    }
  }


  function isValidLinkUrl(value) {
    if (!value) return true;

    value = value.trim();

    // Tolak protocol-relative URL
    if (value.startsWith("//")) {
      return false;
    }

    // Relative URL diperbolehkan
    if (
      value.startsWith("/") ||
      value.startsWith("./") ||
      value.startsWith("../") ||
      value.startsWith("#")
    ) {
      return true;
    }

    // URL http / https
    try {
      const url = new URL(value);

      return (
        url.protocol === "http:" ||
        url.protocol === "https:"
      );
    } catch {
      // Relative seperti produk.html
      return !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(value);
    }
  }


  /*
   * =====================================================
   * CEK LOGIN + ADMIN
   * =====================================================
   */

  async function checkAdmin() {
    try {
      const {
        data: { user },
        error: userError
      } = await supabaseClient.auth.getUser();

      if (userError || !user) {
        window.location.href = "login.html";
        return false;
      }

      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();

      if (profileError) {
        console.error(profileError);

        alert("Gagal memeriksa akun.");

        window.location.href = "index.html";

        return false;
      }

      if (!profile || profile.role !== "admin") {
        alert("Akses ditolak. Halaman ini hanya untuk admin.");

        window.location.href = "index.html";

        return false;
      }

      return true;

    } catch (error) {
      console.error(error);

      window.location.href = "login.html";

      return false;
    }
  }


  /*
   * =====================================================
   * LOAD BANNERS
   * =====================================================
   */

  async function loadBanners() {

    const container =
      document.getElementById("bannerList");

    container.innerHTML = `
      <div class="loading">
        Memuat banner...
      </div>
    `;

    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("banners")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty">
            Belum ada banner.
          </div>
        `;

        return;
      }

      container.innerHTML =
        data.map(renderBanner).join("");

    } catch (error) {

      console.error(error);

      container.innerHTML = `
        <div class="error-box">
          Gagal memuat banner:
          ${escapeHtml(error.message)}
        </div>
      `;
    }
  }


  /*
   * =====================================================
   * RENDER BANNER
   * =====================================================
   */

  function renderBanner(banner) {

    const id = Number(banner.id);

    const title =
      escapeHtml(banner.title || "");

    const description =
      escapeHtml(banner.description || "");

    const imageUrl =
      escapeAttribute(banner.image_url || "");

    const linkUrl =
      escapeHtml(banner.link_url || "");

    const active =
      banner.is_active === true;

    return `
      <div class="banner-item" id="banner-${id}">

        <div class="banner-top">

          <div class="banner-info">

            <div class="banner-title">
              ${title}
            </div>

            <div>
              <span class="badge ${
                active
                  ? "badge-active"
                  : "badge-inactive"
              }">
                ${
                  active
                    ? "● Aktif"
                    : "● Nonaktif"
                }
              </span>
            </div>

            <div class="banner-description">
              ${description || "Tidak ada deskripsi"}
            </div>

            ${
              banner.link_url
                ? `
                  <div class="banner-url">
                    🔗 ${linkUrl}
                  </div>
                `
                : ""
            }

          </div>

          ${
            banner.image_url
              ? `
                <img
                  src="${imageUrl}"
                  class="banner-image"
                  alt="${escapeAttribute(banner.title || "Banner")}"
                  loading="lazy"
                  onerror="this.style.display='none';"
                >
              `
              : ""
          }

        </div>


        <div class="actions">

          <button
            class="btn-warning btn-small"
            onclick="showEditForm(${id})"
          >
            ✏️ Edit
          </button>


          <button
            class="${
              active
                ? "btn-secondary"
                : "btn-success"
            } btn-small"
            onclick="toggleBanner(${id}, ${!active})"
          >
            ${
              active
                ? "⏸ Nonaktifkan"
                : "▶ Aktifkan"
            }
          </button>


          <button
            class="btn-danger btn-small"
            onclick="deleteBanner(${id})"
          >
            🗑️ Hapus
          </button>

        </div>


        <div
          id="edit-form-${id}"
          class="edit-form hidden"
        >

          <h3>✏️ Edit Banner</h3>

          <label>
            Judul
          </label>

          <input
            type="text"
            id="edit-title-${id}"
            maxlength="150"
            value="${escapeAttribute(banner.title || "")}"
          >


          <label>
            Deskripsi
          </label>

          <textarea
            id="edit-description-${id}"
            maxlength="1000"
          >${escapeHtml(banner.description || "")}</textarea>


          <label>
            Image URL
          </label>

          <input
            type="url"
            id="edit-image-${id}"
            value="${escapeAttribute(banner.image_url || "")}"
          >


          <label>
            Link URL
          </label>

          <input
            type="text"
            id="edit-link-${id}"
            value="${escapeAttribute(banner.link_url || "")}"
          >


          <div class="checkbox-row">

            <input
              type="checkbox"
              id="edit-active-${id}"
              ${active ? "checked" : ""}
            >

            <label
              for="edit-active-${id}"
              style="margin:0;"
            >
              Banner aktif
            </label>

          </div>


          <div class="actions">

            <button
              class="btn-primary btn-small"
              onclick="saveBanner(${id})"
            >
              💾 Simpan
            </button>

            <button
              class="btn-secondary btn-small"
              onclick="hideEditForm(${id})"
            >
              Batal
            </button>

          </div>

        </div>

      </div>
    `;
  }


  /*
   * =====================================================
   * TAMBAH BANNER
   * =====================================================
   */

  document
    .getElementById("addBannerForm")
    .addEventListener("submit", async function(event) {

      event.preventDefault();

      const button =
        document.getElementById("addButton");

      const title =
        document.getElementById("title")
          .value.trim();

      const description =
        document.getElementById("description")
          .value.trim();

      const image_url =
        document.getElementById("image_url")
          .value.trim();

      const link_url =
        document.getElementById("link_url")
          .value.trim();

      const is_active =
        document.getElementById("is_active")
          .checked;


      if (!title) {
        showMessage(
          "Judul banner wajib diisi.",
          "error"
        );
        return;
      }


      if (!isValidImageUrl(image_url)) {
        showMessage(
          "Image URL harus menggunakan http:// atau https://.",
          "error"
        );
        return;
      }


      if (!isValidLinkUrl(link_url)) {
        showMessage(
          "Link URL tidak valid.",
          "error"
        );
        return;
      }


      button.disabled = true;
      button.textContent = "⏳ Menyimpan...";


      try {

        const {
          data,
          error
        } = await supabaseClient.rpc(
          "admin_add_banner",
          {
            p_title: title,
            p_description: description,
            p_image_url: image_url,
            p_link_url: link_url,
            p_is_active: is_active
          }
        );


        if (error) {
          throw error;
        }


        showMessage(
          "Banner berhasil ditambahkan."
        );


        document
          .getElementById("addBannerForm")
          .reset();


        document
          .getElementById("is_active")
          .checked = true;


        await loadBanners();

      } catch (error) {

        console.error(error);

        showMessage(
          "Gagal menambah banner: " +
          error.message,
          "error"
        );

      } finally {

        button.disabled = false;
        button.textContent = "➕ Tambah Banner";

      }

    });


  /*
   * =====================================================
   * SHOW EDIT FORM
   * =====================================================
   */

  function showEditForm(id) {

    const form =
      document.getElementById(
        `edit-form-${id}`
      );

    if (!form) return;

    form.classList.remove("hidden");

    form.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
  }


  /*
   * =====================================================
   * HIDE EDIT FORM
   * =====================================================
   */

  function hideEditForm(id) {

    const form =
      document.getElementById(
        `edit-form-${id}`
      );

    if (!form) return;

    form.classList.add("hidden");
  }


  /*
   * =====================================================
   * SIMPAN EDIT
   * =====================================================
   */

  async function saveBanner(id) {

    const title =
      document.getElementById(
        `edit-title-${id}`
      ).value.trim();

    const description =
      document.getElementById(
        `edit-description-${id}`
      ).value.trim();

    const image_url =
      document.getElementById(
        `edit-image-${id}`
      ).value.trim();

    const link_url =
      document.getElementById(
        `edit-link-${id}`
      ).value.trim();

    const is_active =
      document.getElementById(
        `edit-active-${id}`
      ).checked;


    if (!title) {
      showMessage(
        "Judul banner wajib diisi.",
        "error"
      );
      return;
    }


    if (!isValidImageUrl(image_url)) {
      showMessage(
        "Image URL harus menggunakan http:// atau https://.",
        "error"
      );
      return;
    }


    if (!isValidLinkUrl(link_url)) {
      showMessage(
        "Link URL tidak valid.",
        "error"
      );
      return;
    }


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "admin_update_banner",
        {
          p_id: id,
          p_title: title,
          p_description: description,
          p_image_url: image_url,
          p_link_url: link_url,
          p_is_active: is_active
        }
      );


      if (error) {
        throw error;
      }


      showMessage(
        "Banner berhasil diperbarui."
      );


      await loadBanners();

    } catch (error) {

      console.error(error);

      showMessage(
        "Gagal mengedit banner: " +
        error.message,
        "error"
      );
    }
  }


  /*
   * =====================================================
   * TOGGLE AKTIF / NONAKTIF
   * =====================================================
   */

  async function toggleBanner(id, newStatus) {

    const action =
      newStatus
        ? "mengaktifkan"
        : "menonaktifkan";


    const yakin = confirm(
      `Yakin ingin ${action} banner ini?`
    );


    if (!yakin) {
      return;
    }


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "admin_toggle_banner",
        {
          p_id: id,
          p_is_active: newStatus
        }
      );


      if (error) {
        throw error;
      }


      showMessage(
        newStatus
          ? "Banner berhasil diaktifkan."
          : "Banner berhasil dinonaktifkan."
      );


      await loadBanners();

    } catch (error) {

      console.error(error);

      showMessage(
        "Gagal mengubah status banner: " +
        error.message,
        "error"
      );
    }
  }


  /*
   * =====================================================
   * HAPUS BANNER
   * =====================================================
   */

  async function deleteBanner(id) {

    const yakin = confirm(
      "Yakin ingin menghapus banner ini?\n\n" +
      "Data yang sudah dihapus tidak dapat dikembalikan."
    );


    if (!yakin) {
      return;
    }


    try {

      const {
        data,
        error
      } = await supabaseClient.rpc(
        "admin_delete_banner",
        {
          p_id: id
        }
      );


      if (error) {
        throw error;
      }


      showMessage(
        "Banner berhasil dihapus."
      );


      await loadBanners();

    } catch (error) {

      console.error(error);

      showMessage(
        "Gagal menghapus banner: " +
        error.message,
        "error"
      );
    }
  }


  /*
   * =====================================================
   * START
   * =====================================================
   */

  async function init() {

    const isAdmin =
      await checkAdmin();

    if (!isAdmin) {
      return;
    }

    await loadBanners();
  }


  init();

</script>

</body>
</html>
